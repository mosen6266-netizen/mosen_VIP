name: Scan Native Dialogs V2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scan-native-dialogs-v2.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          echo "===SCAN_START==="
          grep -RInE --include='*.html' --include='*.js' --include='*.mjs' --exclude-dir='.git' --exclude-dir='node_modules' '(alert|confirm|prompt)[[:space:]]*\(' . || true
          echo "===SCAN_END==="
