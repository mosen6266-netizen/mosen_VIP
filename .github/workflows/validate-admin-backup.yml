name: Validate Admin Backup JS

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-admin-backup.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract admin module
        run: |
          python3 - <<'PY'
          import re
          s=open('admin.html',encoding='utf-8').read()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          open('/tmp/admin.mjs','w',encoding='utf-8').write(m.group(1))
          PY
      - name: Syntax check
        run: node --check /tmp/admin.mjs
