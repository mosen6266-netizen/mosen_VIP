name: Validate VIP core scripts

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-vip-core.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline module scripts
        run: |
          python3 - <<'PY'
          import re, pathlib
          for name in ['admin.html','sales.html','workflow-admin.html']:
              s=pathlib.Path(name).read_text(encoding='utf-8')
              mods=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
              if not mods:
                  raise SystemExit(f'No module script in {name}')
              pathlib.Path('/tmp/'+name+'.mjs').write_text('\n'.join(mods),encoding='utf-8')
          PY
      - name: JavaScript syntax checks
        run: |
          node --check /tmp/admin.html.mjs
          node --check /tmp/sales.html.mjs
          node --check /tmp/workflow-admin.html.mjs
          node --check vip-workflow.js
          node --check vip-tool-catalog.js
          node --check vip-sales-tools.js
      - name: Build Pages
        run: python3 scripts/build-pages.py
