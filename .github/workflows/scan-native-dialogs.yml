name: Scan Native Browser Dialogs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scan-native-dialogs.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source files
        run: |
          echo "=== NATIVE_DIALOG_SCAN ==="
          grep -RInE --include='*.html' --include='*.js' --include='*.mjs' --exclude-dir='.git' --exclude-dir='node_modules' '\b(alert|confirm|prompt)\s*\(' . || true
          echo "=== END_SCAN ==="
