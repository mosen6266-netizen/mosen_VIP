<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨森维权客户登记系统 · 业务员</title><link rel="icon" type="image/svg+xml" href="./mosen-logo.svg?v=20260926-18"><link rel="stylesheet" href="./style.css?v=20260929-eye-right-39"></head><body>
<div class="topbar"><div class="brand-lockup"><img class="brand-logo" src="./mosen-logo.svg?v=20260926-18" alt="墨森"><div><div class="brand">墨森维权客户登记系统</div><div id="who" class="subbrand"></div></div></div><div class="row"><button id="newBtn" class="btn primary">＋ 登记客户</button><button id="logoutBtn" class="btn soft">退出</button></div></div>
<div class="shell"><div class="stats"><div class="stat"><div id="myCount" class="n">0</div><div class="l">我的客户</div></div><div class="stat"><div id="fieldCount" class="n">0</div><div class="l">当前登记项目</div></div><div class="stat"><div id="todayCount" class="n">0</div><div class="l">今日新增</div></div></div>
<div class="card">
  <div class="customer-view-tabs">
    <button id="activeCustomerTab" class="customer-view-tab active" type="button">我的客户 <span id="activeCustomerTabCount">0</span></button>
    <button id="archiveCustomerTab" class="customer-view-tab" type="button">已归档 <span id="archiveCustomerTabCount">0</span></button>
  </div>
  <div class="row customer-toolbar">
    <div><h2 id="salesCustomerTitle" style="margin:0">我的客户</h2><div class="small">当前业务员：<b id="repLabel"></b></div></div>
    <div class="spacer"></div>
    <input id="search" class="search" placeholder="全局搜索姓名 / 电话 / 邮箱 / 钱包等…">
    <button id="toggleSalesFilters" class="btn soft" type="button">筛选</button>
  </div>
  <div id="salesFilters" class="customer-filter-panel" hidden>
    <div class="field"><label>重点客户</label><select id="salesStarFilter"><option value="">全部</option><option value="1">只看星标</option><option value="0">只看未星标</option></select></div>
    <div class="field"><label>客户进度</label><select id="salesProgressFilter"><option value="">全部进度</option></select></div>
    <div class="field"><label>国家/地区包含</label><input id="salesCountryFilter" placeholder="例如 德国 / 美国"></div>
    <button id="clearSalesFilters" class="btn soft" type="button">清除筛选</button>
  </div>
  <div id="customerList" style="margin-top:16px"></div>
</div></div>

<div id="modal" class="modal" hidden><div class="modal-card customer-edit-modal-card"><div class="row customer-edit-modal-header"><h2 id="modalTitle" style="margin:0">登记客户</h2><div class="spacer"></div><button id="closeModal" class="btn soft">关闭</button></div>
<form id="customerForm">
  <div id="dynamicFields" class="grid" style="margin-top:18px"></div>
  <div class="progress-editor progress-editor-prominent">
    <div class="section-title" style="margin:0 0 10px"><div class="dot"></div><h3 style="margin:0">客户进度</h3><div class="spacer"></div><strong id="editProgressPercent" class="edit-progress-percent">0%</strong></div>
    <div class="percent-progress edit-percent-bar"><span id="editProgressBar" style="width:0%"></span></div>
    <div class="small" style="margin:8px 0 12px">点击下面每一个进度即可打勾或取消，最后点击“保存客户”。</div>
    <div id="progressChecklist" class="progress-checklist"></div>
  </div>
  <div class="row customer-edit-save-bar"><button class="btn primary" type="submit">保存客户</button><button id="cancelEdit" class="btn soft" type="button">取消</button></div>
</form><div id="formNote" class="notice" hidden></div></div></div>

<script type="module" src="./sales-app.js?v=20260929-opt2"></script><script src="./vip-tool-catalog.js?v=20260929-catalog-2"></script><script src="./vip-sales-tools.js?v=20260929-category-strong-4"></script><script src="./vip-workflow.js?v=20260929-standalone-sync-6"></script></body></html>
