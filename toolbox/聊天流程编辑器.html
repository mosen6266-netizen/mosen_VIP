<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>墨森聊天流程编辑器</title>
  <style>
    :root{
      --bg:#f4f5f7;--panel:#fff;--panel-2:#f8f9fb;--text:#17191d;--muted:#6f7480;
      --line:#e4e6eb;--brand:#6d4aff;--brand-2:#5533db;--brand-soft:#eeeaff;
      --danger:#dc3f4f;--success:#198754;--shadow:0 12px 36px rgba(28,31,40,.08);
      --radius:18px;--small-radius:12px;
    }
    [data-theme="dark"]{
      --bg:#101114;--panel:#181a1f;--panel-2:#202229;--text:#f5f6f8;--muted:#a3a8b3;
      --line:#2d3038;--brand:#947aff;--brand-2:#a38cff;--brand-soft:#29233f;
      --danger:#ff7180;--success:#54c98b;--shadow:0 14px 42px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
    button,input,textarea,select{font:inherit;color:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:300px minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);z-index:10}
    .brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px}
    .brand-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),#ac6cff);color:white;box-shadow:0 8px 18px rgba(109,74,255,.28)}
    .brand-mark svg{width:23px;height:23px}
    .brand-copy strong{display:block;font-size:16px;letter-spacing:.02em}.brand-copy span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .sidebar-actions{padding:0 16px 14px}
    .primary,.ghost,.soft,.danger-btn,.icon-btn{border:0;border-radius:11px;transition:.18s ease}
    .primary{background:var(--brand);color:white;padding:11px 15px;font-weight:700;box-shadow:0 6px 14px rgba(109,74,255,.2)}
    .primary:hover{background:var(--brand-2);transform:translateY(-1px)}
    .primary.full{width:100%}
    .ghost{background:transparent;padding:9px 11px;color:var(--muted)}.ghost:hover{background:var(--panel-2);color:var(--text)}
    .soft{background:var(--brand-soft);color:var(--brand-2);padding:9px 12px;font-weight:650}.soft:hover{filter:brightness(.97)}
    .danger-btn{background:rgba(220,63,79,.1);color:var(--danger);padding:9px 12px}
    .icon-btn{width:34px;height:34px;display:grid;place-items:center;background:transparent;color:var(--muted)}.icon-btn:hover{background:var(--panel-2);color:var(--text)}
    .icon-btn svg,.button-icon{width:18px;height:18px;display:block}
    .search{margin:0 16px 10px;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:11px;padding:10px 12px 10px 36px;outline:none}.search input:focus{border-color:var(--brand)}
    .search svg{position:absolute;left:12px;top:11px;width:17px;height:17px;color:var(--muted)}
    .flow-list{padding:4px 10px 20px;overflow:auto;flex:1}
    .flow-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:11px;border-radius:13px;text-align:left;margin:3px 0}
    .flow-item:hover{background:var(--panel-2)}.flow-item.active{background:var(--brand-soft)}
    .flow-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 12%,transparent)}
    .flow-item-copy{min-width:0;flex:1}.flow-item-copy strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.flow-item-copy span{font-size:12px;color:var(--muted);margin-top:3px;display:block}
    .sidebar-footer{padding:13px 16px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}.sidebar-footer button{font-size:12px}
    .main{min-width:0;padding:0 28px 60px}
    .topbar{height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);z-index:9;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
    .top-left{min-width:0}.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.top-title{font-weight:750;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;margin-top:3px}
    .top-actions{display:flex;align-items:center;gap:8px}.top-actions .primary{display:flex;align-items:center;gap:8px}
    .content{max-width:1030px;margin:30px auto}
    .workflow-head{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
    .head-row{display:flex;gap:16px;align-items:flex-start}.color-pick{width:12px;height:58px;border-radius:999px;flex:0 0 auto;margin-top:3px}
    .head-fields{min-width:0;flex:1}.title-input{width:100%;border:0;background:transparent;font-weight:800;font-size:28px;line-height:1.2;padding:0;outline:none}.title-input:focus{box-shadow:0 2px 0 var(--brand)}
    .desc-input{width:100%;border:0;background:transparent;color:var(--muted);font-size:14px;margin-top:10px;padding:0;outline:none;resize:none;min-height:22px}.desc-input:focus{color:var(--text)}
    .head-tools{display:flex;gap:4px}
    .stats{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.stats strong{color:var(--text)}
    .steps-toolbar{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}.steps-toolbar h2{font-size:15px;margin:0}.steps-toolbar-actions{display:flex;gap:7px}
    .step-list{display:flex;flex-direction:column;gap:12px}
    .step-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(28,31,40,.04);overflow:hidden;transition:.18s ease}
    .step-card.dragging{opacity:.5;transform:scale(.99)}.step-card.drag-over{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
    .step-header{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid transparent}
    .step-card.open .step-header{border-bottom-color:var(--line)}
    .drag-handle{color:var(--muted);font-size:18px;letter-spacing:-3px;cursor:grab;user-select:none;padding-right:4px}.drag-handle:active{cursor:grabbing}
    .step-number{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-2);font-weight:800;font-size:13px;flex:0 0 auto}
    .type-badge{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
    .step-summary{min-width:0;flex:1}.step-summary strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.step-summary span{display:block;color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .step-header-actions{display:flex;align-items:center;gap:2px}.chevron{transition:.18s}.step-card.open .chevron{transform:rotate(180deg)}
    .step-body{display:none;padding:18px}.step-card.open .step-body{display:block}
    .grid-2{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:700;color:var(--muted)}
    .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:11px;padding:10px 12px;outline:none}.field textarea{min-height:118px;resize:vertical;line-height:1.65}.field textarea.note{min-height:72px}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
    .content-field{margin-top:14px;position:relative}.content-field .copy-over{position:absolute;right:9px;top:31px}
    .attachments-section{margin-top:16px;padding-top:15px;border-top:1px dashed var(--line)}
    .attachments-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.attachments-head strong{font-size:13px}.attachments-head small{color:var(--muted)}
    .attach-input{display:none}.attach-label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:650;background:var(--panel-2);cursor:pointer}.attach-label:hover{border-color:var(--brand)}
    .attachment-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
    .attachment{min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;overflow:hidden}.attachment-preview{height:112px;background:linear-gradient(135deg,var(--brand-soft),var(--panel-2));display:grid;place-items:center;overflow:hidden}.attachment-preview img{width:100%;height:100%;object-fit:cover}.file-glyph{font-size:34px}
    .attachment-info{padding:9px}.attachment-info strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-info span{font-size:11px;color:var(--muted);display:block;margin-top:3px}.attachment-actions{display:flex;gap:4px;margin-top:7px}.attachment-actions button,.attachment-actions a{font-size:11px;border:0;text-decoration:none;background:var(--panel);color:var(--text);padding:5px 7px;border-radius:7px}.attachment-actions .remove{color:var(--danger)}
    .step-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.move-actions{display:flex;gap:6px}
    .empty{padding:62px 24px;border:1px dashed var(--line);border-radius:18px;text-align:center;background:var(--panel)}.empty .empty-icon{width:62px;height:62px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}.empty-icon svg{width:30px}.empty h3{margin:0 0 8px}.empty p{color:var(--muted);font-size:14px;margin:0 auto 20px;max-width:430px;line-height:1.7}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1d2026;color:white;padding:11px 16px;border-radius:11px;box-shadow:0 12px 32px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.24s;z-index:99;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
    dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);padding:0;box-shadow:0 24px 80px rgba(0,0,0,.25);width:min(560px,calc(100vw - 28px))}dialog::backdrop{background:rgba(12,14,18,.55);backdrop-filter:blur(4px)}
    .dialog-head{padding:22px 22px 14px;display:flex;justify-content:space-between;align-items:flex-start}.dialog-head h3{margin:0;font-size:19px}.dialog-head p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.dialog-body{padding:4px 22px 22px}.export-option{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:16px;display:flex;gap:13px;text-align:left;margin-top:10px}.export-option:hover{border-color:var(--brand);transform:translateY(-1px)}.option-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:0 0 auto}.option-copy strong{display:block;font-size:14px}.option-copy span{display:block;font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}
    .notice{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:11px;padding:11px 12px;line-height:1.55;margin-top:12px}
    .read-banner{display:none;background:#fff4d8;color:#765600;border:1px solid #ffe09a;border-radius:12px;padding:10px 13px;margin-bottom:14px;font-size:13px}.read-only .read-banner{display:block}.read-only .edit-only{display:none!important}.read-only input,.read-only textarea,.read-only select{pointer-events:none}.read-only .title-input,.read-only .desc-input{box-shadow:none}.read-only .drag-handle{display:none}.read-only .step-body{display:block}.read-only .step-card .step-header{border-bottom-color:var(--line)}.read-only .chevron{display:none}
    .mobile-menu{display:none}
    @media(max-width:800px){
      .app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;width:min(320px,88vw);transform:translateX(-105%);transition:.22s;box-shadow:var(--shadow)}.sidebar.mobile-open{transform:none}.mobile-menu{display:grid}.main{padding:0 15px 44px}.topbar{height:68px}.top-left{flex:1}.top-title{max-width:45vw}.top-actions .soft span,.top-actions .primary span{display:none}.top-actions .primary{padding:10px}.content{margin:18px auto}.workflow-head{padding:18px}.title-input{font-size:23px}.grid-2{grid-template-columns:1fr}.step-header{padding:12px}.step-header-actions .edit-extra{display:none}.step-body{padding:14px}.steps-toolbar-actions .ghost{display:none}.attachment-grid{grid-template-columns:1fr 1fr}
    }
    @media(max-width:480px){.attachment-grid{grid-template-columns:1fr}.head-tools{display:none}.stats{gap:10px}.step-summary span{max-width:150px}.type-badge{display:none}}
    @media print{.sidebar,.topbar,.edit-only,.toast,.read-banner{display:none!important}.app{display:block}.main{padding:0}.content{max-width:none;margin:0}.workflow-head,.step-card{box-shadow:none;break-inside:avoid}.step-body{display:block!important}.step-header{border-bottom:1px solid var(--line)}body{background:white;color:black}}
  </style>
</head>
<body>
  <script id="flow-data" type="application/json">{"version":1,"bundleId":"mosen-starter","shareMode":false,"theme":"light","activeWorkflowId":"flow-welcome","workflows":[{"id":"flow-welcome","name":"助理接待流程","description":"这是一个可直接修改或删除的示例流程","color":"#6d4aff","createdAt":0,"updatedAt":0,"steps":[{"id":"step-hello","title":"开场问候","type":"话术","content":"您好，很高兴为您服务。请问有什么可以帮到您？","note":"先确认客户当前是否方便沟通。","attachments":[]},{"id":"step-needs","title":"确认客户需求","type":"提问","content":"为了更准确地了解您的情况，请您简单说明一下目前遇到的问题。","note":"根据客户回答进入相应的后续流程。","attachments":[]}]}]}</script>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></svg></div>
        <div class="brand-copy"><strong>墨森流程工作台</strong><span>离线单文件版</span></div>
      </div>
      <div class="sidebar-actions edit-only"><button class="primary full" id="newFlowBtn">＋ 新建聊天流程</button></div>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="searchInput" placeholder="搜索流程…"></div>
      <div class="flow-list" id="flowList"></div>
      <div class="sidebar-footer edit-only">
        <button class="ghost" id="importBtn">导入备份</button>
        <button class="ghost" id="backupBtn">导出备份</button>
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:8px;min-width:0">
          <button class="icon-btn mobile-menu" id="mobileMenuBtn" aria-label="打开菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="top-left"><div class="eyebrow" id="modeLabel">正在编辑</div><div class="top-title" id="topTitle">助理接待流程</div></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" title="切换主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
          <button class="soft" id="printBtn"><span>打印流程</span></button>
          <button class="primary edit-only" id="saveHtmlBtn"><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg><span>保存为 HTML</span></button>
        </div>
      </header>
      <div class="content">
        <div class="read-banner">这是只读分享版。你可以查看、复制内容和下载附件，但不能在此文件中编辑流程。</div>
        <div id="workspace"></div>
      </div>
    </main>
  </div>
  <dialog id="exportDialog">
    <div class="dialog-head"><div><h3>保存完整 HTML 文件</h3><p>当前所有流程、话术、图片和附件都会直接嵌入新文件。</p></div><button class="icon-btn" id="closeDialog" aria-label="关闭">✕</button></div>
    <div class="dialog-body">
      <button class="export-option" data-export="editable"><span class="option-icon">✎</span><span class="option-copy"><strong>保存可编辑版</strong><span>保留全部编辑功能，适合你自己备份后继续维护。</span></span></button>
      <button class="export-option" data-export="readonly"><span class="option-icon">◉</span><span class="option-copy"><strong>导出只读分享版</strong><span>收件人可以查看、复制、打印和下载附件，编辑按钮会隐藏。</span></span></button>
      <div class="notice" id="sizeNotice">提示：每次修改后都需要重新保存并发送新的 HTML 文件，已发出的旧文件不会自动同步更新。</div>
    </div>
  </dialog>
  <div class="toast" id="toast"></div>
  <script>
  (()=>{
    'use strict';
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const flowData=$('#flow-data'), workspace=$('#workspace'), flowList=$('#flowList'), sidebar=$('#sidebar');
    const COLORS=['#6d4aff','#148a8a','#d05d31','#b33d76','#2776c7','#66822d','#a06a16'];
    const TYPES=['话术','提问','客户回复','操作提示','说明','结束语'];
    const uid=(p='id')=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
    const now=()=>Date.now();
    const fmtTime=t=>t?new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t)):'尚未修改';
    const formatBytes=n=>{if(!n)return'0 B';const u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),3);return (n/1024**i).toFixed(i?1:0)+' '+u[i]};
    const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const safeJson=o=>JSON.stringify(o).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    let embedded;
    try{embedded=JSON.parse(flowData.textContent)}catch(e){embedded={version:1,bundleId:uid('bundle'),shareMode:false,theme:'light',workflows:[],activeWorkflowId:null}}
    const storageKey='mosen-flow-studio:'+embedded.bundleId;
    let state=embedded;
    if(!embedded.shareMode){try{const local=localStorage.getItem(storageKey);if(local)state=JSON.parse(local)}catch(e){}}
    state.version=1; state.bundleId=state.bundleId||uid('bundle'); state.workflows=Array.isArray(state.workflows)?state.workflows:[];
    state.workflows.forEach(normalizeFlow);
    if(!state.activeWorkflowId&&state.workflows[0])state.activeWorkflowId=state.workflows[0].id;
    let openSteps=new Set(), searchTerm='', dragId=null, toastTimer;

    function normalizeFlow(f){f.id=f.id||uid('flow');f.name=String(f.name||'未命名流程');f.description=String(f.description||'');f.color=f.color||COLORS[0];f.createdAt=f.createdAt||now();f.updatedAt=f.updatedAt||f.createdAt;f.steps=Array.isArray(f.steps)?f.steps:[];f.steps.forEach(s=>{s.id=s.id||uid('step');s.title=String(s.title||'未命名步骤');s.type=TYPES.includes(s.type)?s.type:'话术';s.content=String(s.content||'');s.note=String(s.note||'');s.attachments=Array.isArray(s.attachments)?s.attachments.filter(a=>a&&typeof a.data==='string'&&a.data.startsWith('data:')):[]})}
    function activeFlow(){return state.workflows.find(f=>f.id===state.activeWorkflowId)||null}
    function persist(){if(state.shareMode)return;try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){showToast('本地空间不足，请立即保存为 HTML 文件')};flowData.textContent=safeJson(state)}
    function touch(flow=activeFlow()){if(flow)flow.updatedAt=now();persist()}
    function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
    function icon(name){const icons={copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15M10 10v7m4-7v7"/></svg>',more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',chev:'<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></svg>'};return icons[name]||''}
    function render(){document.documentElement.dataset.theme=state.theme||'light';document.body.classList.toggle('read-only',!!state.shareMode);$('#modeLabel').textContent=state.shareMode?'只读分享版':'正在编辑';renderFlowList();renderWorkspace();if(state.shareMode){$$('input,textarea',workspace).forEach(el=>el.readOnly=true);$$('select',workspace).forEach(el=>el.disabled=true)}}
    function renderFlowList(){const items=state.workflows.filter(f=>(f.name+' '+f.description).toLowerCase().includes(searchTerm.toLowerCase()));flowList.innerHTML=items.length?items.map(f=>`<button class="flow-item ${f.id===state.activeWorkflowId?'active':''}" data-flow-id="${esc(f.id)}"><span class="flow-dot" style="color:${esc(f.color)};background:${esc(f.color)}"></span><span class="flow-item-copy"><strong>${esc(f.name)}</strong><span>${f.steps.length} 个步骤</span></span></button>`).join(''):`<div style="padding:24px 12px;text-align:center;color:var(--muted);font-size:13px">没有找到流程</div>`}
    function renderWorkspace(){const f=activeFlow();$('#topTitle').textContent=f?f.name:'聊天流程';if(!f){workspace.innerHTML=`<div class="empty"><div class="empty-icon">${icon('empty')}</div><h3>还没有聊天流程</h3><p>新建一个流程，然后按顺序添加标题、话术、图片和附件。保存为 HTML 后，内容会跟随文件一起发送。</p><button class="primary edit-only" id="emptyNewBtn">新建第一个流程</button></div>`;$('#emptyNewBtn')?.addEventListener('click',createFlow);return}
      const bytes=f.steps.flatMap(s=>s.attachments||[]).reduce((n,a)=>n+(a.size||0),0);
      workspace.innerHTML=`<section class="workflow-head"><div class="head-row"><span class="color-pick" style="background:${esc(f.color)}"></span><div class="head-fields"><input class="title-input" id="flowName" value="${esc(f.name)}" aria-label="流程标题"><textarea class="desc-input" id="flowDesc" rows="1" placeholder="添加流程说明…">${esc(f.description)}</textarea></div><div class="head-tools edit-only"><button class="icon-btn" id="duplicateFlow" title="复制流程">${icon('copy')}</button><button class="icon-btn" id="deleteFlow" title="删除流程">${icon('trash')}</button></div></div><div class="stats"><span><strong>${f.steps.length}</strong> 个步骤</span><span><strong>${f.steps.reduce((n,s)=>n+s.content.length,0)}</strong> 个文字</span><span>附件 <strong>${formatBytes(bytes)}</strong></span><span>更新于 ${fmtTime(f.updatedAt)}</span></div></section>
      <div class="steps-toolbar"><h2>流程步骤</h2><div class="steps-toolbar-actions"><button class="ghost" id="toggleAll">${openSteps.size===f.steps.length&&f.steps.length?'全部收起':'全部展开'}</button><button class="soft edit-only" id="addStepBtn">＋ 添加步骤</button></div></div>
      <div class="step-list" id="stepList">${f.steps.length?f.steps.map((s,i)=>stepHtml(s,i,f.steps.length)).join(''):`<div class="empty"><div class="empty-icon">${icon('plus')}</div><h3>这个流程还是空的</h3><p>添加第一个步骤，把每一句话术、操作提醒或客户回复按实际顺序整理好。</p><button class="primary edit-only" id="emptyStepBtn">添加第一个步骤</button></div>`}</div>`;
      bindWorkspace(f)
    }
    function stepHtml(s,i,total){const isOpen=state.shareMode||openSteps.has(s.id);return `<article class="step-card ${isOpen?'open':''}" data-step-id="${esc(s.id)}" draggable="${state.shareMode?'false':'true'}"><div class="step-header"><span class="drag-handle edit-only" title="拖动排序">⠿</span><span class="step-number">${i+1}</span><span class="type-badge">${esc(s.type)}</span><div class="step-summary"><strong>${esc(s.title||'未命名步骤')}</strong><span>${esc(s.content||'暂无话术内容')}</span></div><div class="step-header-actions"><button class="icon-btn copy-step edit-extra" title="复制话术">${icon('copy')}</button><button class="icon-btn toggle-step" title="展开或收起">${icon('chev')}</button></div></div><div class="step-body"><div class="grid-2"><div class="field"><label>步骤标题</label><input data-field="title" value="${esc(s.title)}" placeholder="例如：开场问候"></div><div class="field"><label>内容类型</label><select data-field="type">${TYPES.map(t=>`<option ${t===s.type?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field content-field"><label>话术 / 内容</label><textarea data-field="content" placeholder="输入这一环节要发送或说明的内容…">${esc(s.content)}</textarea><button class="icon-btn copy-over copy-step" title="复制内容">${icon('copy')}</button></div><div class="field" style="margin-top:14px"><label>内部备注（可选）</label><textarea class="note" data-field="note" placeholder="例如：客户回答“是”时进入下一步…">${esc(s.note)}</textarea></div>${attachmentsHtml(s)}<div class="step-footer edit-only"><div class="move-actions"><button class="ghost move-up" ${i===0?'disabled':''}>↑ 上移</button><button class="ghost move-down" ${i===total-1?'disabled':''}>↓ 下移</button></div><button class="danger-btn delete-step">删除步骤</button></div></div></article>`}
    function attachmentsHtml(s){return `<div class="attachments-section"><div class="attachments-head"><div><strong>图片与文件</strong> <small>会嵌入导出的 HTML</small></div><label class="attach-label edit-only">＋ 添加附件<input class="attach-input" type="file" multiple></label></div>${s.attachments.length?`<div class="attachment-grid">${s.attachments.map(a=>`<div class="attachment" data-attachment-id="${esc(a.id)}"><div class="attachment-preview">${a.type?.startsWith('image/')?`<img src="${a.data}" alt="${esc(a.name)}">`:`<span class="file-glyph">${fileGlyph(a.name)}</span>`}</div><div class="attachment-info"><strong title="${esc(a.name)}">${esc(a.name)}</strong><span>${formatBytes(a.size)}</span><div class="attachment-actions"><a href="${a.data}" download="${esc(a.name)}">下载</a>${a.type?.startsWith('image/')?`<a href="${a.data}" target="_blank">查看</a>`:''}<button class="remove edit-only">移除</button></div></div></div>`).join('')}</div>`:''}</div>`}
    function fileGlyph(name){const e=(name.split('.').pop()||'').toLowerCase();return ['pdf'].includes(e)?'📕':['doc','docx'].includes(e)?'📘':['xls','xlsx','csv'].includes(e)?'📗':['zip','rar','7z'].includes(e)?'🗜️':'📄'}
    function bindWorkspace(f){
      $('#flowName').addEventListener('input',e=>{f.name=e.target.value||'未命名流程';$('#topTitle').textContent=f.name;touch(f);renderFlowList()});
      $('#flowDesc').addEventListener('input',e=>{f.description=e.target.value;touch(f)});
      $('#duplicateFlow')?.addEventListener('click',()=>duplicateFlow(f));$('#deleteFlow')?.addEventListener('click',()=>deleteFlow(f));
      $('#addStepBtn')?.addEventListener('click',()=>addStep(f));$('#emptyStepBtn')?.addEventListener('click',()=>addStep(f));
      $('#toggleAll')?.addEventListener('click',()=>{if(openSteps.size===f.steps.length)openSteps.clear();else f.steps.forEach(s=>openSteps.add(s.id));renderWorkspace()});
      $$('.step-card',$('#stepList')).forEach(card=>bindStep(card,f));
    }
    function bindStep(card,f){const id=card.dataset.stepId, s=f.steps.find(x=>x.id===id);if(!s)return;
      $('.toggle-step',card).addEventListener('click',()=>{openSteps.has(id)?openSteps.delete(id):openSteps.add(id);card.classList.toggle('open')});
      $$('.copy-step',card).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();copyText(s.content)}));
      $$('[data-field]',card).forEach(el=>el.addEventListener('input',()=>{s[el.dataset.field]=el.value;touch(f);const summary=$('.step-summary',card);$('strong',summary).textContent=s.title||'未命名步骤';$('span',summary).textContent=s.content||'暂无话术内容';$('.type-badge',card).textContent=s.type}));
      $('.move-up',card)?.addEventListener('click',()=>moveStep(f,id,-1));$('.move-down',card)?.addEventListener('click',()=>moveStep(f,id,1));
      $('.delete-step',card)?.addEventListener('click',()=>{if(confirm('确定删除这个步骤吗？')){f.steps=f.steps.filter(x=>x.id!==id);openSteps.delete(id);touch(f);render()}});
      $('.attach-input',card)?.addEventListener('change',e=>addAttachments(f,s,[...e.target.files]));
      $$('.attachment',card).forEach(el=>$('.remove',el)?.addEventListener('click',()=>{s.attachments=s.attachments.filter(a=>a.id!==el.dataset.attachmentId);touch(f);renderWorkspace()}));
      card.addEventListener('dragstart',e=>{if(state.shareMode)return;e.dataTransfer.effectAllowed='move';dragId=id;card.classList.add('dragging')});
      card.addEventListener('dragend',()=>{dragId=null;card.classList.remove('dragging');$$('.step-card').forEach(c=>c.classList.remove('drag-over'))});
      card.addEventListener('dragover',e=>{if(!dragId||dragId===id)return;e.preventDefault();card.classList.add('drag-over')});card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
      card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drag-over');if(!dragId||dragId===id)return;const from=f.steps.findIndex(x=>x.id===dragId),to=f.steps.findIndex(x=>x.id===id);const [m]=f.steps.splice(from,1);f.steps.splice(to,0,m);touch(f);renderWorkspace()});
    }
    function createFlow(){const f={id:uid('flow'),name:'新建聊天流程',description:'',color:COLORS[state.workflows.length%COLORS.length],createdAt:now(),updatedAt:now(),steps:[]};state.workflows.push(f);state.activeWorkflowId=f.id;touch(f);render();setTimeout(()=>{$('#flowName')?.select()},0);sidebar.classList.remove('mobile-open')}
    function duplicateFlow(f){const c=JSON.parse(JSON.stringify(f));c.id=uid('flow');c.name=f.name+'（副本）';c.createdAt=c.updatedAt=now();c.color=COLORS[(state.workflows.indexOf(f)+1)%COLORS.length];c.steps.forEach(s=>s.id=uid('step'));state.workflows.push(c);state.activeWorkflowId=c.id;touch(c);render();showToast('流程已复制')}
    function deleteFlow(f){if(!confirm(`确定删除“${f.name}”吗？此操作不会影响已导出的旧文件。`))return;state.workflows=state.workflows.filter(x=>x.id!==f.id);state.activeWorkflowId=state.workflows[0]?.id||null;persist();render();showToast('流程已删除')}
    function addStep(f){const s={id:uid('step'),title:'新步骤',type:'话术',content:'',note:'',attachments:[]};f.steps.push(s);openSteps.add(s.id);touch(f);renderWorkspace();setTimeout(()=>{const c=$(`[data-step-id="${s.id}"]`);c?.scrollIntoView({behavior:'smooth',block:'center'});$('[data-field="title"]',c)?.select()},20)}
    function moveStep(f,id,d){const i=f.steps.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=f.steps.length)return;[f.steps[i],f.steps[j]]=[f.steps[j],f.steps[i]];touch(f);renderWorkspace()}
    async function addAttachments(f,s,files){const maxOne=20*1024*1024,totalNow=state.workflows.flatMap(x=>x.steps).flatMap(x=>x.attachments).reduce((n,a)=>n+(a.size||0),0);let running=totalNow,added=0;for(const file of files){if(file.size>maxOne){showToast(`${file.name} 超过 20MB，已跳过`);continue}if(running+file.size>50*1024*1024){showToast('全部附件已接近 50MB，请先精简文件');break}try{const data=await readFile(file);s.attachments.push({id:uid('att'),name:file.name,type:file.type||'application/octet-stream',size:file.size,data});running+=file.size;added++}catch(e){showToast(`${file.name} 读取失败`)}}if(added){touch(f);renderWorkspace();showToast(`已添加 ${added} 个附件`)} }
    function readFile(file){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
    async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}showToast(text?'已复制话术':'内容为空')}
    function backup(){const blob=new Blob([safeJson({...state,shareMode:false})],{type:'application/json'});downloadBlob(blob,filename('流程备份','json'));showToast('备份已导出')}
    function importBackup(file){const r=new FileReader;r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.workflows))throw Error();data.workflows.forEach(normalizeFlow);state={...data,bundleId:state.bundleId,shareMode:false};state.activeWorkflowId=state.workflows[0]?.id||null;persist();render();showToast('备份已导入')}catch(e){alert('无法导入：这不是有效的流程备份文件。')}};r.readAsText(file)}
    function attachmentBytes(){return state.workflows.flatMap(f=>f.steps).flatMap(s=>s.attachments).reduce((n,a)=>n+(a.size||0),0)}
    function exportHtml(readonly){
      $('#exportDialog').close();
      const previous=flowData.textContent, exportState=JSON.parse(JSON.stringify(state));exportState.shareMode=readonly;exportState.theme=state.theme;exportState.bundleId=readonly?uid('share'):state.bundleId;
      flowData.textContent=safeJson(exportState);const html='<!doctype html>\n'+document.documentElement.outerHTML;flowData.textContent=previous;
      downloadBlob(new Blob([html],{type:'text/html;charset=utf-8'}),filename(readonly?'聊天流程-只读分享版':'聊天流程-可编辑版','html'));showToast('HTML 文件已生成，请查看下载内容')
    }
    function filename(suffix,ext){const base=(activeFlow()?.name||'墨森聊天流程').replace(/[\\/:*?"<>|]/g,'-').slice(0,40);const d=new Date(),date=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;return `${base}-${suffix}-${date}.${ext}`}
    function downloadBlob(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}

    $('#newFlowBtn').addEventListener('click',createFlow);$('#searchInput').addEventListener('input',e=>{searchTerm=e.target.value;renderFlowList()});
    flowList.addEventListener('click',e=>{const b=e.target.closest('[data-flow-id]');if(!b)return;state.activeWorkflowId=b.dataset.flowId;persist();openSteps.clear();render();sidebar.classList.remove('mobile-open')});
    $('#saveHtmlBtn').addEventListener('click',()=>{persist();$('#sizeNotice').textContent=`当前附件共 ${formatBytes(attachmentBytes())}。每次修改后都需要重新保存并发送新的 HTML 文件，已发出的旧文件不会自动同步更新。`;$('#exportDialog').showModal()});
    $('#closeDialog').addEventListener('click',()=>$('#exportDialog').close());$('#exportDialog').addEventListener('click',e=>{if(e.target===$('#exportDialog'))e.target.close()});
    $$('[data-export]').forEach(b=>b.addEventListener('click',()=>exportHtml(b.dataset.export==='readonly')));
    $('#backupBtn').addEventListener('click',backup);$('#importBtn').addEventListener('click',()=>$('#importInput').click());$('#importInput').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''})
    $('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';persist();render()});$('#printBtn').addEventListener('click',()=>window.print());
    $('#mobileMenuBtn').addEventListener('click',()=>sidebar.classList.toggle('mobile-open'));document.addEventListener('click',e=>{if(innerWidth<=800&&!sidebar.contains(e.target)&&!$('#mobileMenuBtn').contains(e.target))sidebar.classList.remove('mobile-open')});
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!state.shareMode){e.preventDefault();persist();$('#saveHtmlBtn').click()}if(e.key==='Escape')sidebar.classList.remove('mobile-open')});
    render();persist();
  })();
  </script>
</body>
</html>
