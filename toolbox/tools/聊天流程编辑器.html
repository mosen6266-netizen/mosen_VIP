    function renderFlowList(){const items=state.workflows.filter(f=>(f.name+' '+f.description).toLowerCase().includes(searchTerm.toLowerCase()));flowList.innerHTML=items.length?items.map(f=>`<button class="flow-item ${f.id===state.activeWorkflowId?'active':''}" data-flow-id="${esc(f.id)}"><span class="flow-dot" style="color:${esc(f.color)};background:${esc(f.color)}"></span><span class="flow-item-copy"><strong>${esc(f.name)}</strong><span>${f.steps.length} 个步骤</span></span></button>`).join(''):`<div style="padding:24px 12px;text-align:center;color:var(--muted);font-size:13px">没有找到流程</div>`}
    function renderWorkspace(){const f=activeFlow();$('#topTitle').textContent=f?f.name:'聊天流程';if(!f){workspace.innerHTML=`<div class="empty"><div class="empty-icon">${icon('empty')}</div><h3>还没有聊天流程</h3><p>新建一个流程，然后按顺序添加标题、话术、图片和附件。保存为 HTML 后，内容会跟随文件一起发送。</p><button class="primary edit-only" id="emptyNewBtn">新建第一个流程</button></div>`;$('#emptyNewBtn')?.addEventListener('click',createFlow);return}
      const bytes=f.steps.flatMap(s=>s.attachments||[]).reduce((n,a)=>n+(a.size||0),0);

      <div class="steps-toolbar"><h2>流程步骤</h2><div class="steps-toolbar-actions"><button class="ghost" id="toggleAll">${openSteps.size===f.steps.length&&f.steps.length?'全部收起':'全部展开'}</button><button class="soft edit-only" id="addStepBtn">＋ 添加步骤</button></div></div>

    function toolCategoryName(category){return category==='us'?'美国':category==='de'?'德国':'其它'}
    function normalizeToolPath(path){return String(path||'').replace(/^\.\//,'').replace(/^\.\.\//,'')}
    function toolHref(path){const base=IS_HOSTED?new URL('../',location.href).href:TOOL_PUBLIC_BASE;try{return new URL(normalizeToolPath(path),base).href}catch{return '#'}}
    function toolDisplayName(x){const prefix=toolCategoryName(x.category);return x.category==='other'?x.title:`${prefix} · ${x.title}`}
    function dedupeTools(items){const seen=new Set();return items.filter(x=>{x.path=normalizeToolPath(x.path);if(!x.path||x.path==='tools/聊天流程编辑器.html'||seen.has(x.path))return false;seen.add(x.path);return true})}
    async function loadToolCatalog(){
      const fresh=[];
      try{
        const res=await fetch(TOOL_CENTER_URL+'?v='+Date.now(),{cache:'no-store'});
        if(res.ok){
          const doc=new DOMParser().parseFromString(await res.text(),'text/html');
          doc.querySelectorAll('.card[href]').forEach(card=>{
            const path=card.getAttribute('href')||'', category=card.closest('[data-section]')?.dataset.section||'other';
            const title=(card.querySelector('.title')?.textContent||card.dataset.name||path).trim();
            fresh.push({id:card.dataset.id||path,path,title,category});
          });
        }
      }catch(_){}
      try{
        const res=await fetch(TOOL_INDEX_URL+'?v='+Date.now(),{cache:'no-store'});
        if(res.ok){
          const data=await res.json();
          for(const t of (data.tools||[]))fresh.push({id:t.id||t.path,path:t.path,title:t.title||t.name||t.path,category:t.category||'other'});
        }
      }catch(_){}
      toolCatalog=dedupeTools(fresh.length?fresh:[...TOOL_FALLBACK_CATALOG]);
      toolCatalogLoaded=true;
      if(activeFlow())renderWorkspace();
      if($('#addStepDialog')?.open)renderPendingStepTools();
    }
    function toolOptionsHtml(s){
      const used=new Set((s.toolLinks||[]).map(x=>normalizeToolPath(x.path)));
      const available=toolCatalog.filter(x=>!used.has(normalizeToolPath(x.path)));
      if(!available.length)return `<option value="">${toolCatalogLoaded?'没有更多可添加的工具':'正在读取打开器工具…'}</option>`;
      let html='<option value="">选择打开器中的工具…</option>';
      for(const key of ['us','de','other']){
        const group=available.filter(x=>x.category===key);if(!group.length)continue;
        html+=`<optgroup label="${toolCategoryName(key)}">`+group.map(x=>`<option value="${esc(x.path)}">${esc(toolDisplayName(x))}</option>`).join('')+'</optgroup>';
      }
      return html;
    }
    function toolShortcutsHtml(s){if(!s.toolLinks?.length)return'';return `<div class="tool-shortcuts">${s.toolLinks.map(x=>`<a class="tool-shortcut" href="${esc(toolHref(x.path))}" target="_blank" rel="noopener" title="打开 ${esc(toolDisplayName(x))}"><span class="tool-arrow">↗</span><span class="tool-label">${esc(toolDisplayName(x))}</span></a>`).join('')}</div>`}
    function toolPickerHtml(s){return `<div class="tool-link-section edit-only"><div class="tool-link-head"><div><strong>工具快捷方式</strong> <small>显示在本条气泡上，点击可直接打开</small></div></div><div class="tool-picker-row"><select class="tool-picker">${toolOptionsHtml(s)}</select><button type="button" class="soft add-tool-link">＋ 添加快捷方式</button></div>${s.toolLinks?.length?`<div class="tool-link-list">${s.toolLinks.map(x=>`<div class="tool-link-edit" data-tool-link-id="${esc(x.id)}"><span title="${esc(toolDisplayName(x))}">${esc(toolDisplayName(x))}</span><button type="button" class="remove-tool-link" title="移除">×</button></div>`).join('')}</div>`:''}</div>`}
    function requirementHtml(s){const image=s.attachments.some(isImage),pdf=s.attachments.some(isPdf);if(!image&&!pdf)return'';return `<div class="requirement-badges">${image?'<span class="requirement-badge image">需发送图片</span>':''}${pdf?'<span class="requirement-badge pdf">需发送 PDF</span>':''}</div>`}
    function bubblePreviewsHtml(s){const items=s.attachments.filter(a=>isImage(a)||isPdf(a));if(!items.length)return'';return `<div class="bubble-thumbs">${items.slice(0,3).map(a=>{const src=attachmentSrc(a),pdf=isPdf(a);return `<button class="bubble-thumb ${pdf?'pdf':''} view-preview" data-attachment-id="${esc(a.id)}" title="${pdf?'点击查看 PDF':'点击放大查看'}">${pdf?`<embed src="${esc(src)}#page=1&toolbar=0&navpanes=0&scrollbar=0" type="application/pdf">`:`<img src="${esc(src)}" alt="${esc(a.name)}">`}</button>`}).join('')}<span class="thumb-hint">点击查看</span></div>`}
    function stepHtml(s,i,total){const isOpen=state.shareMode||openSteps.has(s.id),hasImage=s.attachments.some(isImage),hasPdf=s.attachments.some(isPdf),lang=languageName(s);return `<article class="step-card ${isOpen?'open':''} ${hasImage?'has-image':''} ${hasPdf?'has-pdf':''}" data-step-id="${esc(s.id)}" draggable="${state.shareMode?'false':'true'}"><div class="step-header"><span class="drag-handle edit-only" title="拖动排序">⠿</span><span class="step-number">${i+1}</span><span class="type-badge">${esc(s.type)}</span><div class="step-summary"><strong>${esc(s.title||'未命名步骤')}</strong><div class="bilingual-preview"><div class="script-row zh-line"><em>中文</em><span>${esc(s.contentZh||'暂无中文话术')}</span></div><div class="script-row foreign foreign-line"><em>${lang}</em><span>${esc(s.contentForeign||`暂无${lang}话术`)}</span></div></div>${requirementHtml(s)}${toolShortcutsHtml(s)}</div>${bubblePreviewsHtml(s)}<div class="step-header-actions"><button class="icon-btn copy-step edit-extra" title="复制${lang}话术">${icon('copy')}</button><button class="icon-btn toggle-step" title="展开或收起">${icon('chev')}</button></div></div><div class="step-body"><div class="grid-2"><div class="field"><label>步骤标题</label><input data-field="title" value="${esc(s.title)}" placeholder="例如：开场问候"></div><div class="field"><label>内容类型</label><select data-field="type">${TYPES.map(t=>`<option ${t===s.type?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field content-field"><label>中文版本</label><textarea data-field="contentZh" placeholder="输入方便自己理解的中文话术…">${esc(s.contentZh)}</textarea></div><div class="field content-field"><div class="lang-label-row"><label>英文 / 德语版本 <span class="lang-detected">已识别为 ${lang}</span></label><select class="language-select" data-field="language"><option value="auto" ${s.language==='auto'?'selected':''}>自动识别</option><option value="en" ${s.language==='en'?'selected':''}>English</option><option value="de" ${s.language==='de'?'selected':''}>Deutsch</option></select></div><textarea data-field="contentForeign" placeholder="输入要实际发送的英文或德语话术…">${esc(s.contentForeign)}</textarea><button class="icon-btn copy-over copy-step" title="复制${lang}话术">${icon('copy')}</button></div><div class="field" style="margin-top:14px"><label>内部备注（可选）</label><textarea class="note" data-field="note" placeholder="例如：客户回答“是”时进入下一步…">${esc(s.note)}</textarea></div>${toolPickerHtml(s)}${attachmentsHtml(s)}<div class="step-footer edit-only"><div class="move-actions"><button class="ghost move-up" ${i===0?'disabled':''}>↑ 上移</button><button class="ghost move-down" ${i===total-1?'disabled':''}>↓ 下移</button></div><button class="danger-btn delete-step">删除步骤</button></div></div></article>`}
    function attachmentsHtml(s){return `<div class="attachments-section"><div class="attachments-head"><div><strong>图片与文件</strong> <small>公开同步后所有人可查看</small></div><label class="attach-label edit-only">＋ 添加附件<input class="attach-input" type="file" multiple accept="image/*,application/pdf,.pdf"></label></div>${s.attachments.length?`<div class="attachment-grid">${s.attachments.map(a=>{const src=attachmentSrc(a),pdf=isPdf(a);return `<div class="attachment" data-attachment-id="${esc(a.id)}"><div class="attachment-preview">${isImage(a)?`<img src="${esc(src)}" alt="${esc(a.name)}">`:pdf?`<embed src="${esc(src)}#page=1&toolbar=0&navpanes=0&scrollbar=0" type="application/pdf" style="width:100%;height:100%;pointer-events:none;background:#fff">`:`<span class="file-glyph">${fileGlyph(a.name)}</span>`}</div><div class="attachment-info"><strong title="${esc(a.name)}">${esc(a.name)}</strong><span>${formatBytes(a.size)}</span><div class="attachment-actions"><a href="${esc(src)}" download="${esc(a.name)}">下载</a>${isImage(a)||pdf?`<button class="view-preview" data-attachment-id="${esc(a.id)}">${pdf?'查看 PDF':'放大查看'}</button>`:''}<button class="remove edit-only">移除</button></div></div></div>`}).join('')}</div>`:''}</div>`}
    function fileGlyph(name){const e=(name.split('.').pop()||'').toLowerCase();return ['pdf'].includes(e)?'📕':['doc','docx'].includes(e)?'📘':['xls','xlsx','csv'].includes(e)?'📗':['zip','rar','7z'].includes(e)?'🗜️':'📄'}
    function bindWorkspace(f){
      $('#flowName').addEventListener('input',e=>{f.name=e.target.value||'未命名流程';$('#topTitle').textContent=f.name;touch(f);renderFlowList()});
      $('#flowDesc').addEventListener('input',e=>{f.description=e.target.value;touch(f)});
      $('#duplicateFlow')?.addEventListener('click',()=>duplicateFlow(f));$('#deleteFlow')?.addEventListener('click',()=>deleteFlow(f));
      $('#addStepBtn')?.addEventListener('click',()=>addStep(f));$('#emptyStepBtn')?.addEventListener('click',()=>addStep(f));
      $('#toggleAll')?.addEventListener('click',()=>{if(openSteps.size===f.steps.length)openSteps.clear();else f.steps.forEach(s=>openSteps.add(s.id));renderWorkspace()});
      $$('.step-card',$('#stepList')).forEach(card=>bindStep(card,f));

    function bindStep(card,f){const id=card.dataset.stepId, s=f.steps.find(x=>x.id===id);if(!s)return;
      $('.toggle-step',card).addEventListener('click',()=>{openSteps.has(id)?openSteps.delete(id):openSteps.add(id);card.classList.toggle('open')});
      $$('.copy-step',card).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();copyText(s.contentForeign,languageName(s))}));
      $$('[data-field]',card).forEach(el=>el.addEventListener('input',()=>{s[el.dataset.field]=el.value;touch(f);const summary=$('.step-summary',card),lang=languageName(s);$('strong',summary).textContent=s.title||'未命名步骤';$('.zh-line span',summary).textContent=s.contentZh||'暂无中文话术';$('.foreign-line span',summary).textContent=s.contentForeign||`暂无${lang}话术`;$('.foreign-line em',summary).textContent=lang;$('.lang-detected',card).textContent=`已识别为 ${lang}`;$$('.copy-step',card).forEach(b=>b.title=`复制${lang}话术`);$('.type-badge',card).textContent=s.type}));
      $('.move-up',card)?.addEventListener('click',()=>moveStep(f,id,-1));$('.move-down',card)?.addEventListener('click',()=>moveStep(f,id,1));
      $('.delete-step',card)?.addEventListener('click',async()=>{if(await vipConfirm('确定删除这个步骤吗？',{title:'删除步骤',confirmText:'删除',danger:true})){f.steps=f.steps.filter(x=>x.id!==id);openSteps.delete(id);touch(f);render()}});
      $('.attach-input',card)?.addEventListener('change',e=>addAttachments(f,s,[...e.target.files]));
      $$('.attachment',card).forEach(el=>$('.remove',el)?.addEventListener('click',()=>{s.attachments=s.attachments.filter(a=>a.id!==el.dataset.attachmentId);touch(f);renderWorkspace()}));
      $$('.view-preview',card).forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const a=s.attachments.find(x=>x.id===el.dataset.attachmentId);if(a)openPreview(a)}));
      $('.add-tool-link',card)?.addEventListener('click',()=>{const select=$('.tool-picker',card),path=select?.value;if(!path)return showToast('请先选择一个工具');const t=toolCatalog.find(x=>normalizeToolPath(x.path)===normalizeToolPath(path));if(!t)return showToast('这个工具暂时不可用');s.toolLinks=s.toolLinks||[];if(s.toolLinks.some(x=>normalizeToolPath(x.path)===normalizeToolPath(t.path)))return showToast('这条气泡已经添加过该工具');s.toolLinks.push({id:uid('tool'),path:t.path,title:t.title,category:t.category});touch(f);renderWorkspace();showToast('快捷方式已添加')});
      $$('.remove-tool-link',card).forEach(btn=>btn.addEventListener('click',()=>{const item=btn.closest('[data-tool-link-id]');s.toolLinks=(s.toolLinks||[]).filter(x=>x.id!==item?.dataset.toolLinkId);touch(f);renderWorkspace();showToast('快捷方式已移除')}));
      card.addEventListener('dragstart',e=>{if(state.shareMode)return;e.dataTransfer.effectAllowed='move';dragId=id;card.classList.add('dragging')});
      card.addEventListener('dragend',()=>{dragId=null;card.classList.remove('dragging');$$('.step-card').forEach(c=>c.classList.remove('drag-over'))});
      card.addEventListener('dragover',e=>{if(!dragId||dragId===id)return;e.preventDefault();card.classList.add('drag-over')});card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
      card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drag-over');if(!dragId||dragId===id)return;const from=f.steps.findIndex(x=>x.id===dragId),to=f.steps.findIndex(x=>x.id===id);const [m]=f.steps.splice(from,1);f.steps.splice(to,0,m);touch(f);renderWorkspace()});
    }
    function createFlow(){const f={id:uid('flow'),name:'新建聊天流程',description:'',color:COLORS[state.workflows.length%COLORS.length],createdAt:now(),updatedAt:now(),steps:[]};state.workflows.push(f);state.activeWorkflowId=f.id;touch(f);render();setTimeout(()=>{$('#flowName')?.select()},0);sidebar.classList.remove('mobile-open')}
    function duplicateFlow(f){const c=JSON.parse(JSON.stringify(f));c.id=uid('flow');c.name=f.name+'（副本）';c.createdAt=c.updatedAt=now();c.color=COLORS[(state.workflows.indexOf(f)+1)%COLORS.length];c.steps.forEach(s=>{s.id=uid('step');s.attachments.forEach(a=>a.id=uid('att'))});state.workflows.push(c);state.activeWorkflowId=c.id;touch(c);render();showToast('流程已复制')}
    async function deleteFlow(f){if(!await vipConfirm(`确定删除“${f.name}”吗？此操作不会影响已导出的旧文件。`,{title:'删除流程',confirmText:'删除',danger:true}))return;state.workflows=state.workflows.filter(x=>x.id!==f.id);state.activeWorkflowId=state.workflows[0]?.id||null;persist();render();showToast('流程已删除')}
    function renderPendingStepTools(){const picker=$('#newStepToolPicker'),list=$('#newStepToolList');if(!picker||!list)return;picker.innerHTML=toolOptionsHtml({toolLinks:pendingStepToolLinks});list.innerHTML=pendingStepToolLinks.length?`<div class="tool-link-list">${pendingStepToolLinks.map(x=>`<div class="tool-link-edit" data-pending-tool-id="${esc(x.id)}"><span title="${esc(toolDisplayName(x))}">${esc(toolDisplayName(x))}</span><button type="button" class="remove-pending-tool" title="移除">×</button></div>`).join('')}</div>`:'<div class="add-step-empty">还没有添加快捷方式</div>';$$('.remove-pending-tool',list).forEach(btn=>btn.addEventListener('click',()=>{const item=btn.closest('[data-pending-tool-id]');pendingStepToolLinks=pendingStepToolLinks.filter(x=>x.id!==item?.dataset.pendingToolId);renderPendingStepTools()}))}
    function renderPendingAttachments(){const box=$('#newStepAttachmentList');if(!box)return;box.innerHTML=pendingStepAttachments.length?`<div class="attachment-grid">${pendingStepAttachments.map(a=>`<div class="attachment pending-attachment" data-pending-attachment-id="${esc(a.id)}"><div class="attachment-preview">${isImage(a)?`<img src="${esc(a.data)}" alt="${esc(a.name)}">`:`<span class="file-glyph">${fileGlyph(a.name)}</span>`}</div><div class="attachment-info"><strong title="${esc(a.name)}">${esc(a.name)}</strong><span>${formatBytes(a.size)}</span><div class="attachment-actions"><button type="button" class="remove remove-pending-attachment">移除</button></div></div></div>`).join('')}</div>`:'<div class="add-step-empty">还没有添加附件</div>';$$('.remove-pending-attachment',box).forEach(btn=>btn.addEventListener('click',()=>{const item=btn.closest('[data-pending-attachment-id]');pendingStepAttachments=pendingStepAttachments.filter(a=>a.id!==item?.dataset.pendingAttachmentId);renderPendingAttachments()}))}
    function addStep(f){if(!f)return;pendingStepAttachments=[];pendingStepToolLinks=[];$('#newStepTitle').value='新步骤';$('#newStepType').value='话术';$('#newStepZh').value='';$('#newStepForeign').value='';$('#newStepLanguage').value='auto';$('#newStepNote').value='';renderPendingStepTools();renderPendingAttachments();$('#newStepAttachmentInput').value='';$('#addStepDialog').showModal();setTimeout(()=>$('#newStepTitle')?.select(),20)}
    function addPendingTool(){const picker=$('#newStepToolPicker'),path=picker?.value;if(!path)return showToast('请先选择一个工具');const t=toolCatalog.find(x=>normalizeToolPath(x.path)===normalizeToolPath(path));if(!t)return showToast('这个工具暂时不可用');if(pendingStepToolLinks.some(x=>normalizeToolPath(x.path)===normalizeToolPath(t.path)))return showToast('已经添加过该工具');pendingStepToolLinks.push({id:uid('tool'),path:t.path,title:t.title,category:t.category});renderPendingStepTools();showToast('快捷方式已添加')}
    async function addPendingAttachments(files){const maxOne=20*1024*1024,totalNow=state.workflows.flatMap(x=>x.steps).flatMap(x=>x.attachments).reduce((n,a)=>n+(a.size||0),0);let running=totalNow+pendingStepAttachments.reduce((n,a)=>n+(a.size||0),0),added=0;for(const file of files){if(file.size>maxOne){showToast(`${file.name} 超过 20MB，已跳过`);continue}if(running+file.size>50*1024*1024){showToast('全部附件已接近 50MB，请先精简文件');break}try{const data=await readFile(file);pendingStepAttachments.push({id:uid('att'),name:file.name,type:file.type||'application/octet-stream',size:file.size,data});running+=file.size;added++}catch(e){showToast(`${file.name} 读取失败`)}}renderPendingAttachments();if(added)showToast(`已添加 ${added} 个附件`)}
    function confirmAddStep(){const f=activeFlow();if(!f)return $('#addStepDialog').close();const s={id:uid('step'),title:$('#newStepTitle').value.trim()||'新步骤',type:$('#newStepType').value,contentZh:$('#newStepZh').value,contentForeign:$('#newStepForeign').value,language:$('#newStepLanguage').value,note:$('#newStepNote').value,attachments:pendingStepAttachments,toolLinks:pendingStepToolLinks};f.steps.push(s);pendingStepAttachments=[];pendingStepToolLinks=[];touch(f);$('#addStepDialog').close();renderWorkspace();showToast('步骤已添加')}
    function moveStep(f,id,d){const i=f.steps.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=f.steps.length)return;[f.steps[i],f.steps[j]]=[f.steps[j],f.steps[i]];touch(f);renderWorkspace()}
    async function addAttachments(f,s,files){const maxOne=20*1024*1024,totalNow=state.workflows.flatMap(x=>x.steps).flatMap(x=>x.attachments).reduce((n,a)=>n+(a.size||0),0);let running=totalNow,added=0;for(const file of files){if(file.size>maxOne){showToast(`${file.name} 超过 20MB，已跳过`);continue}if(running+file.size>50*1024*1024){showToast('全部附件已接近 50MB，请先精简文件');break}try{const data=await readFile(file);s.attachments.push({id:uid('att'),name:file.name,type:file.type||'application/octet-stream',size:file.size,data});running+=file.size;added++}catch(e){showToast(`${file.name} 读取失败`)}}if(added){touch(f);renderWorkspace();showToast(`已添加 ${added} 个附件`)} }
    function readFile(file){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
    async function copyText(text,lang='外语'){try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}showToast(text?`已复制 ${lang} 话术`:'外语话术为空')}
    let previewOpener=null;
    function openPreview(a){const viewer=$('#imageViewer'),src=attachmentSrc(a),pdf=isPdf(a);previewOpener=document.activeElement;viewer.classList.toggle('pdf-mode',pdf);if(pdf){$('#viewerPdf').src=src+'#toolbar=1&navpanes=0';$('#viewerImage').removeAttribute('src')}else{$('#viewerImage').src=src;$('#viewerImage').alt=a.name||'图片预览';$('#viewerPdf').src='about:blank'}$('#viewerCaption').textContent=(a.name||(pdf?'PDF':'图片'))+' · 点击内容外空白处或按 ESC 关闭';viewer.showModal()}
    function backup(){const blob=new Blob([safeJson({...state,shareMode:false})],{type:'application/json'});downloadBlob(blob,filename('流程备份','json'));showToast('备份已导出')}
    function importBackup(file){const r=new FileReader;r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.workflows))throw Error();data.workflows.forEach(normalizeFlow);state={...data,bundleId:state.bundleId,shareMode:false};state.activeWorkflowId=state.workflows[0]?.id||null;persist();render();showToast('备份已导入')}catch(e){vipAlert('无法导入：这不是有效的流程备份文件。')}};r.readAsText(file)}
    function attachmentBytes(){return state.workflows.flatMap(f=>f.steps).flatMap(s=>s.attachments).reduce((n,a)=>n+(a.size||0),0)}
    async function exportHtml(readonly){
      $('#exportDialog').close();
      const previous=flowData.textContent, exportState=JSON.parse(JSON.stringify(state));exportState.shareMode=readonly;exportState.theme=state.theme;exportState.bundleId=readonly?uid('share'):state.bundleId;
      for(const a of exportState.workflows.flatMap(f=>f.steps).flatMap(s=>s.attachments)){if(!a.data&&a.url){try{const res=await fetch(new URL(a.url,location.href));if(res.ok)a.data=await readFile(await res.blob())}catch(_){}}}
      flowData.textContent=safeJson(exportState);const html='<!doctype html>\n'+document.documentElement.outerHTML;flowData.textContent=previous;
      downloadBlob(new Blob([html],{type:'text/html;charset=utf-8'}),filename(readonly?'聊天流程-只读分享版':'聊天流程-可编辑版','html'));showToast('HTML 文件已生成，请查看下载内容')
    }
    function filename(suffix,ext){const base=(activeFlow()?.name||'墨森聊天流程').replace(/[\\/:*?"<>|]/g,'-').slice(0,40);const d=new Date(),date=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;return `${base}-${suffix}-${date}.${ext}`}
    function downloadBlob(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
    function setSyncStatus(text,type='ok'){const box=$('#syncStatus');$('span:last-child',box).textContent=text;box.style.background=type==='error'?'#fff0f0':type==='working'?'#fff7e6':'#eaf8f1';box.style.color=type==='error'?'#a43c48':type==='working'?'#8a5b00':'#176944'}
    async function loadPublicState(){if(!IS_HOSTED||embedded.shareMode)return;setSyncStatus('正在加载公开内容','working');try{const res=await fetch(PUBLIC_DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('公开数据暂不可用');const data=await res.json();if(!Array.isArray(data.workflows))throw new Error('公开数据格式无效');data.workflows.forEach(normalizeFlow);state={...data,version:2,bundleId:'mosen-public-flows',theme:state.theme||'light',shareMode:false};state.activeWorkflowId=state.workflows.some(f=>f.id===data.activeWorkflowId)?data.activeWorkflowId:state.workflows[0]?.id||null;flowData.textContent=safeJson(state);openSteps.clear();render();setSyncStatus(data.globalUpdatedAt?'公开内容已同步':'公开内容已加载');}catch(err){setSyncStatus('公开内容加载失败','error');showToast(err.message||'公开内容加载失败')}}
    function utf8ToBase64(text){const bytes=new TextEncoder().encode(text);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary)}
    async function githubApi(path,token,method='GET',body){const res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`,{method,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||`GitHub 请求失败 (${res.status})`);return data}
    function safeAssetName(a){const clean=String(a.name||'attachment').replace(/[\\/:*?"<>|#%]/g,'-').replace(/\s+/g,'-').slice(-90);return `${a.id}-${clean}`}
    async function syncPublic(){if(!IS_HOSTED)return;const token=((await vipPrompt('同步公开流程需要 GitHub 写入授权。\n\n请粘贴仅对 mosen_VIP 仓库具有 Contents: Read and write 权限的 Fine-grained personal access token。\n\n令牌只用于本次同步，不会保存。',{title:'同步公开流程',inputType:'password',placeholder:'Fine-grained personal access token',confirmText:'开始同步'}))||'').trim();if(!token){showToast('已取消同步');return}const btn=$('#syncBtn');btn.disabled=true;btn.querySelector('span').textContent='正在同步…';setSyncStatus('正在上传公开内容','working');try{const ref=await githubApi('/git/ref/heads/'+BRANCH,token),head=ref.object.sha,commit=await githubApi('/git/commits/'+head,token);const publicState=JSON.parse(JSON.stringify(state));publicState.version=2;publicState.bundleId='mosen-public-flows';publicState.shareMode=false;publicState.globalUpdatedAt=new Date().toISOString();const entries=[];for(const a of publicState.workflows.flatMap(f=>f.steps).flatMap(s=>s.attachments)){if(a.data&&a.data.startsWith('data:')){const match=a.data.match(/^data:([^;,]+)?;base64,([\s\S]+)$/);if(!match)throw new Error(`${a.name} 的文件数据无效`);const path='data/chat-flow-assets/'+safeAssetName(a);setSyncStatus('正在上传 '+a.name,'working');const blob=await githubApi('/git/blobs',token,'POST',{content:match[2],encoding:'base64'});entries.push({path,mode:'100644',type:'blob',sha:blob.sha});a.url='../'+path;delete a.data}}
        const jsonBlob=await githubApi('/git/blobs',token,'POST',{content:utf8ToBase64(JSON.stringify(publicState,null,2)+'\n'),encoding:'base64'});entries.push({path:PUBLIC_DATA_PATH,mode:'100644',type:'blob',sha:jsonBlob.sha});const tree=await githubApi('/git/trees',token,'POST',{base_tree:commit.tree.sha,tree:entries});const next=await githubApi('/git/commits',token,'POST',{message:'Publish public chat flows',tree:tree.sha,parents:[head]});await githubApi('/git/refs/heads/'+BRANCH,token,'PATCH',{sha:next.sha,force:false});state.globalUpdatedAt=publicState.globalUpdatedAt;persist();setSyncStatus('公开内容已同步');showToast('同步成功，所有访客将看到最新流程')}catch(err){setSyncStatus('同步失败','error');vipAlert('同步失败：'+(err.message||err))}finally{btn.disabled=false;btn.querySelector('span').textContent='同步公开内容'}}

    $('#newFlowBtn').addEventListener('click',createFlow);$('#searchInput').addEventListener('input',e=>{searchTerm=e.target.value;renderFlowList()});
    flowList.addEventListener('click',e=>{const b=e.target.closest('[data-flow-id]');if(!b)return;state.activeWorkflowId=b.dataset.flowId;persist();openSteps.clear();render();sidebar.classList.remove('mobile-open')});
    $('#saveHtmlBtn').addEventListener('click',()=>{persist();$('#sizeNotice').textContent=`当前附件共 ${formatBytes(attachmentBytes())}。每次修改后都需要重新保存并发送新的 HTML 文件，已发出的旧文件不会自动同步更新。`;$('#exportDialog').showModal()});
    $('#syncBtn').addEventListener('click',syncPublic);
    $('#closeDialog').addEventListener('click',()=>$('#exportDialog').close());$('#exportDialog').addEventListener('click',e=>{if(e.target===$('#exportDialog'))e.target.close()});
    $('#closeAddStepDialog').addEventListener('click',()=>$('#addStepDialog').close());$('#cancelAddStep').addEventListener('click',()=>$('#addStepDialog').close());$('#confirmAddStep').addEventListener('click',confirmAddStep);$('#addNewStepTool').addEventListener('click',addPendingTool);$('#newStepAttachmentInput').addEventListener('change',async e=>{if(e.target.files?.length)await addPendingAttachments([...e.target.files]);e.target.value=''});$('#addStepDialog').addEventListener('click',e=>{if(e.target===$('#addStepDialog'))e.target.close()});
    $$('[data-export]').forEach(b=>b.addEventListener('click',()=>exportHtml(b.dataset.export==='readonly')));
    $('#viewerClose').addEventListener('click',()=>$('#imageViewer').close());$('#imageViewer').addEventListener('click',e=>{if(e.target===$('#imageViewer')||e.target===$('#viewerStage'))$('#imageViewer').close()});$('#imageViewer').addEventListener('close',()=>{previewOpener?.blur();previewOpener=null;$('#viewerPdf').src='about:blank';$('#imageViewer').classList.remove('pdf-mode')});
    $('#backupBtn').addEventListener('click',backup);$('#importBtn').addEventListener('click',()=>$('#importInput').click());$('#importInput').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''})
    $('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';persist();render()});$('#printBtn').addEventListener('click',()=>window.print());
    $('#mobileMenuBtn').addEventListener('click',()=>sidebar.classList.toggle('mobile-open'));document.addEventListener('click',e=>{if(innerWidth<=800&&!sidebar.contains(e.target)&&!$('#mobileMenuBtn').contains(e.target))sidebar.classList.remove('mobile-open')});
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!state.shareMode){e.preventDefault();persist();(IS_HOSTED?$('#syncBtn'):$('#saveHtmlBtn')).click()}if(e.key==='Escape')sidebar.classList.remove('mobile-open')});
    render();persist();loadPublicState();loadToolCatalog();
  })();
  </script>
</body>
