<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨森维权客户登记系统 · 业务员登录</title><link rel="icon" type="image/svg+xml" href="./mosen-logo.svg?v=20260926-18"><link rel="stylesheet" href="./style.css?v=20260927-36"></head><body>
<div class="login-wrap"><div class="login-box"><img class="login-brand-logo" src="./mosen-logo.svg?v=20260926-18" alt="墨森"><div class="pill">业务员入口</div><h1 style="margin-top:12px">登录墨森维权客户登记系统</h1><div class="muted">输入管理员为你创建的业务员用户名即可登录。</div><div class="field" style="margin-top:20px"><label>业务员用户名</label><input id="username" autocomplete="username" placeholder="请输入用户名"></div><button id="loginBtn" class="btn primary" style="width:100%;margin-top:18px">登录</button><div class="row" style="margin-top:14px"><a href="./index.html" class="small">返回首页</a></div><div id="note" class="notice" hidden></div></div></div>
<script type="module">
import { base44, showMessage } from './base44.js?v=20260927-33';
const username=document.getElementById('username'),note=document.getElementById('note'),loginBtn=document.getElementById('loginBtn');
async function findRep(name){const reps=await base44.entities.SalesRep.list('-created_date',500);return reps.find(r=>String(r.username||'').toLowerCase()===String(name||'').trim().toLowerCase())}
loginBtn.onclick=async()=>{const n=username.value.trim();if(!n){showMessage(note,'请输入业务员用户名。','err');return}loginBtn.disabled=true;showMessage(note,'正在登录…');try{const rep=await findRep(n);if(!rep){showMessage(note,'用户名不存在，请联系管理员创建。','err');return}localStorage.setItem('m717_rep_username',rep.username);localStorage.setItem('m717_rep_display_name',rep.display_name||rep.username);location.href='./sales.html?v=20260927-38'}catch(err){showMessage(note,'登录失败，请稍后再试。','err')}finally{loginBtn.disabled=false}};
(async()=>{const old=localStorage.getItem('m717_rep_username');if(old){try{if(await findRep(old))location.href='./sales.html?v=20260927-38';else localStorage.removeItem('m717_rep_username')}catch(_){}}})();
</script></body></html>
