<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MOSEN VIP · 话术管理</title>
<link rel="icon" type="image/svg+xml" href="./mosen-logo.svg">
<style>
:root{--line:#e6e9ef;--text:#172033;--muted:#758095;--bg:#f7f8fb;--purple:#6d4aff;--danger:#c9362b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:12px;font-weight:900;color:var(--purple);letter-spacing:.05em}.side h1{font-size:19px;margin:5px 0 4px}.sub{font-size:11px;color:var(--muted);line-height:1.5}
.flow-actions{display:flex;gap:7px;margin:14px 0 8px;flex-wrap:wrap}.category-actions{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer;background:#eef1f5;color:#344054}.btn.primary{background:var(--purple);color:#fff}.btn.danger{background:#fff0ef;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}
.flow-list{display:grid;gap:10px}.flow-group-card{border:1px solid #e3e7ef;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.035)}.flow-group-head{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#f6f4ff;border-bottom:1px solid #ebe7ff;cursor:pointer;user-select:none}.flow-group-head:hover{background:#f1edff}.flow-group-head b{font-size:11px;color:#5c3bd1;flex:1}.flow-group-count{font-size:9px;font-weight:900;color:#7b6bb6;background:#fff;border:1px solid #e0d9ff;border-radius:999px;padding:2px 6px}.flow-group-chevron{font-size:11px;color:#8b7cc3;transition:transform .15s ease}.flow-group-card.collapsed .flow-group-chevron{transform:rotate(-90deg)}.flow-group-body{padding:5px}.flow-group-card.collapsed .flow-group-body{display:none}.flow-item{width:100%;border:0;background:transparent;border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer}.flow-item:hover{background:#f8f7ff}.flow-item.active{background:#eeeaff;color:#5c38d0}.flow-item b{display:block;font-size:12.5px}.flow-item span{display:block;font-size:9.5px;color:#8a93a4;margin-top:3px}.flow-category-select{border:1px solid #d9dee7;border-radius:9px;padding:7px 9px;background:#fff;color:#344054;font-size:11px;font-weight:800}
.main{min-width:0;padding:18px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:12px;z-index:5;box-shadow:0 8px 28px rgba(20,29,48,.05)}
.toolbar h2{font-size:18px;margin:0}.toolbar .meta{font-size:11px;color:var(--muted);margin-top:3px}.spacer{flex:1}.save-status{font-size:11px;color:#677287}
.steps{display:grid;gap:8px;margin-top:12px}.step{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.step-head{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid #eef1f5}.num{width:27px;height:27px;border-radius:8px;background:#f1edff;color:#633fd7;display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto}.step-title{min-width:0;flex:1}.step-title b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step-title span{font-size:10px;color:#8a93a4}.step-actions{display:flex;gap:5px}
.preview{padding:9px 11px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{min-width:0}.label{font-size:9px;font-weight:900;color:#8a93a4;margin-bottom:3px}.clip{font-size:12px;line-height:1.45;color:#344054;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.clip.zh{background:#f7f8fa;border-radius:8px;padding:7px 8px;color:#5e697b}
.empty{background:#fff;border:1px dashed #cfd5df;border-radius:14px;padding:36px;text-align:center;color:#7b8495;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:50;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 30px 90px rgba(15,23,42,.25);scrollbar-gutter:stable}
.modal-head{position:sticky;top:-20px;z-index:20;display:flex;align-items:center;gap:10px;margin:-20px -20px 14px;padding:16px 20px;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border-bottom:1px solid #eef1f5}.modal-head h3{margin:0;font-size:18px}
.step-modal-actions{position:sticky;bottom:-20px;z-index:20;margin:14px -20px -20px!important;padding:12px 20px;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border-top:1px solid #eef1f5;box-shadow:0 -8px 24px rgba(15,23,42,.05)}.grid{display:grid;grid-template-columns:1fr 180px;gap:10px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;color:#667085;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #d9dee7;border-radius:10px;padding:9px 10px;outline:none;background:#fff}.field textarea{min-height:115px;resize:vertical}.field textarea.large{min-height:150px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9b87ee;box-shadow:0 0 0 3px rgba(109,74,255,.08)}
.notice{margin-top:10px;padding:9px 11px;border-radius:9px;background:#f6f8fa;font-size:11px;color:#667085}.notice.ok{background:#effaf5;color:#087443}.notice.err{background:#fff1f0;color:#b42318}
.asset-section{margin-top:14px;padding-top:14px;border-top:1px solid #eef1f5}.asset-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.asset-head b{font-size:12px}.asset-head span{font-size:10px;color:#8a93a4}.asset-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border:1px solid #e3e7ee;border-radius:9px;background:#fafbfc;margin-top:6px}.asset-row .name{min-width:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-row .meta{font-size:9px;color:#98a2b3;margin-top:2px}.asset-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:7px}.asset-add.three{grid-template-columns:140px minmax(0,1fr) auto}.file-label{position:relative;overflow:hidden}.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}.empty-mini{font-size:10px;color:#98a2b3;padding:7px 0}
.step-context-menu{position:fixed;z-index:2147483000;width:190px;padding:6px;background:#fff;border:1px solid #e4e8ef;border-radius:12px;box-shadow:0 18px 50px rgba(15,23,42,.18);display:grid;gap:3px}
.step-context-menu[hidden]{display:none}
.step-context-menu button{width:100%;border:0;background:transparent;border-radius:8px;padding:9px 10px;text-align:left;font-size:12px;font-weight:800;color:#344054;cursor:pointer}
.step-context-menu button:hover{background:#f2efff;color:#5f3fd0}
.step-context-menu .menu-title{padding:5px 10px 4px;font-size:9px;font-weight:900;color:#98a2b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.flow-list{display:flex;overflow:auto}.flow-item{min-width:190px}.main{padding:12px}.preview{grid-template-columns:1fr}.toolbar{top:5px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">MOSEN VIP · 管理员</div>
    <h1>话术管理</h1>
    <div class="sub">在这里修改、添加、删除维权流程话术。保存后，业务员下一次打开维权流程会自动读取最新内容。</div>
    <div class="flow-actions">
      <button class="btn primary" id="addFlow">新增流程</button>
      <button class="btn" id="renameFlow">改流程名</button>
      <button class="btn danger" id="deleteFlow">删除流程</button>
    </div>
    <div class="field" style="margin:8px 0 7px">
      <label>分类管理</label>
      <select id="categoryManageSelect" class="flow-category-select"></select>
    </div>
    <div class="category-actions">
      <button class="btn" id="addCategory">新建分类</button>
      <button class="btn" id="renameCategory">改分类名</button>
      <button class="btn danger" id="deleteCategory">删除分类</button>
    </div>
    <div class="field" style="margin:0 0 12px">
      <label>当前流程分类</label>
      <select id="flowCategorySelect" class="flow-category-select"></select>
    </div>
    <div class="flow-list" id="flowList"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <div><h2 id="flowTitle">正在读取…</h2><div class="meta" id="flowMeta">请稍候</div></div>
      <div class="spacer"></div>
      <span class="save-status" id="saveStatus"></span>
      <button class="btn primary" id="addStep">新增话术</button>
      <button class="btn" id="reloadBtn">刷新</button>
    </div>
    <div class="steps" id="stepList"></div>
  </main>
</div>

<div class="step-context-menu" id="stepContextMenu" hidden>
  <div class="menu-title" id="stepContextTitle">话术操作</div>
  <button type="button" data-insert="above">＋ 在上方添加新话术</button>
  <button type="button" data-insert="below">＋ 在下方添加新话术</button>
</div>

<div class="modal" id="stepModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><h3 id="stepModalTitle">编辑话术</h3><div class="spacer"></div><button class="btn" id="closeStepModal">关闭</button></div>
    <div class="grid">
      <div class="field"><label>标题</label><input id="stepTitle" placeholder="例如 自我介绍"></div>
      <div class="field"><label>类型</label><select id="stepType"><option>话术</option><option>提问</option><option>客户回复</option><option>操作提示</option><option>说明</option><option>结束语</option></select></div>
    </div>
    <div class="field"><label>中文参考</label><textarea class="large" id="stepZh"></textarea></div>
    <div class="field"><label>实际发送内容（德语 / 英语）</label><textarea class="large" id="stepForeign"></textarea></div>
    <div class="field"><label>备注（可选）</label><textarea id="stepNote"></textarea></div>

    <div class="asset-section">
      <div class="asset-head"><b>图片附件</b><span>只上传本地图片</span></div>
      <div class="asset-add">
        <label class="btn file-label">上传本地图片<input id="attachmentFile" type="file" accept="image/*" multiple></label>
        <div></div>
      </div>
      <div id="attachmentList"></div>
    </div>

    <div class="asset-section">
      <div class="asset-head"><b>快捷方式管理</b><span>只显示德国和美国工具，已移除“其它”分类</span></div>
      <div class="field" style="margin-bottom:8px">
        <label>德国工具</label>
        <div class="asset-add">
          <select id="shortcutSelectDe"><option value="">选择德国工具…</option></select>
          <button class="btn" id="addShortcutDe" type="button">添加</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:8px">
        <label>美国工具</label>
        <div class="asset-add">
          <select id="shortcutSelectUs"><option value="">选择美国工具…</option></select>
          <button class="btn" id="addShortcutUs" type="button">添加</button>
        </div>
      </div>
      <div id="shortcutList"></div>
    </div>

    <div class="row step-modal-actions" style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn" id="cancelStep">取消</button>
      <button class="btn primary" id="saveStep">保存话术</button>
    </div>
    <div id="stepNoteMsg" class="notice" hidden></div>
  </div>
</div>

<script src="./vip-dialogs.js"></script>
<script src="./vip-tool-catalog.js?v=20260929-1"></script>
<script type="module">
import { base44, esc } from './base44.js';

if(localStorage.getItem('mVIP_admin')!=='1'){
  location.href='./admin.html';
}

const $=s=>document.querySelector(s);
let row=null,state={workflows:[]},activeFlowId='',editingStepId='',busy=false;
let pendingAttachments=[],pendingToolLinks=[],toolCatalog=[];
let pendingInsertIndex=null,contextStepId='';
let collapsedCategories=new Set();

function uid(prefix='step'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function unwrap(v){return Array.isArray(v)?v:(v?.items||[])}
function activeFlow(){return (state.workflows||[]).find(f=>String(f.id)===String(activeFlowId))||state.workflows?.[0]||null}
function inferredCategory(f){
  const explicit=String(f?.category||'').trim();
  if(explicit)return explicit;
  const name=String(f?.name||'');
  if(name.includes('美国'))return 'us';
  if(name.includes('德国'))return 'de';
  return 'de';
}
function ensureCategories(){
  if(!Array.isArray(state.categories)||!state.categories.length){
    state.categories=[
      {id:'de',name:'德国流程',order:1},
      {id:'us',name:'美国流程',order:2}
    ];
  }
  state.categories=state.categories.map((x,i)=>({
    id:String(x?.id||uid('cat')),
    name:String(x?.name||('分类 '+(i+1))),
    order:Number.isFinite(Number(x?.order))?Number(x.order):i+1
  })).sort((a,b)=>a.order-b.order);
  (state.workflows||[]).forEach(f=>{
    const cat=inferredCategory(f);
    if(!state.categories.some(x=>String(x.id)===String(cat))){
      state.categories.push({id:cat,name:cat==='us'?'美国流程':cat==='de'?'德国流程':cat,order:state.categories.length+1});
    }
    f.category=cat;
  });
}
function categoryById(id){return (state.categories||[]).find(x=>String(x.id)===String(id))||null}
function setStatus(text,type=''){const el=$('#saveStatus');el.textContent=text;el.style.color=type==='err'?'#b42318':type==='ok'?'#087443':'#677287'}
function safeClone(v){return JSON.parse(JSON.stringify(v))}
function formatBytes(n){n=Number(n||0);if(!n)return'';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i?n.toFixed(1):Math.round(n))+' '+u[i]}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=reject;r.readAsDataURL(file)})}
function attachmentId(){return uid('att')}
function toolId(){return uid('tool')}
function normalizeToolPath(p){return String(p||'').trim().replace(/^\.\/toolbox\//,'').replace(/^toolbox\//,'').replace(/^\.\//,'')}

const FALLBACK_TOOLS=[
  {id:'tether-freeze-us',title:'Tether 冻结报告',path:'Tether冻结报告.html',category:'us'},
  {id:'tether-freeze-de',title:'Tether 冻结报告 · 德国',path:'Tether冻结报告-德国.html',category:'de'},
  {id:'tether-custody-us',title:'Tether 冻结资金保留',path:'Tether冻结资金保留.html',category:'us'},
  {id:'tether-custody-de',title:'Tether 冻结资金保留 · 德国',path:'Tether冻结资金保留-德国.html',category:'de'},
  {id:'risk-us',title:'网站风险查询',path:'网站风险查询.html',category:'us'},
  {id:'risk-de',title:'网站风险查询 · 德国',path:'网站风险查询-德国.html',category:'de'},
  {id:'investigation-us',title:'资金路径调查',path:'资金路径调查.html',category:'us'},
  {id:'investigation-de',title:'资金路径调查 · 德国',path:'资金路径调查-德国.html',category:'de'},
  {id:'lawyer-report-us',title:'资金路径调查律师报告',path:'资金路径调查律师报告.html',category:'us'},
  {id:'lawyer-report-de',title:'资金路径调查律师报告 · 德国',path:'资金路径调查律师报告-德国.html',category:'de'},
  {id:'assistant-report-us',title:'资金路径调查助理报告',path:'资金路径调查助理报告.html',category:'us'},
  {id:'assistant-report-de',title:'资金路径调查助理报告 · 德国',path:'资金路径调查助理报告-德国.html',category:'de'},
  {id:'onchain-us',title:'Onchain Wallet · Address Intelligence',path:'tools/Onchain钱包地址查询.html',category:'us'},
  {id:'onchain-de',title:'Onchain Wallet · Adressanalyse',path:'tools/Onchain钱包地址查询-德国.html',category:'de'}
];

async function loadToolCatalog(){
  try{
    const catalog=await window.VIPToolCatalog.load(true);
    toolCatalog=(catalog.items||[]).filter(t=>['de','us'].includes(String(t.category||'').toLowerCase()));
  }catch(_){
    toolCatalog=[...FALLBACK_TOOLS];
  }
  const de=toolCatalog.map((t,i)=>({t,i})).filter(x=>String(x.t.category).toLowerCase()==='de');
  const us=toolCatalog.map((t,i)=>({t,i})).filter(x=>String(x.t.category).toLowerCase()==='us');
  $('#shortcutSelectDe').innerHTML='<option value="">选择德国工具…</option>'+de.map(x=>'<option value="'+x.i+'">'+esc(x.t.title)+'</option>').join('');
  $('#shortcutSelectUs').innerHTML='<option value="">选择美国工具…</option>'+us.map(x=>'<option value="'+x.i+'">'+esc(x.t.title)+'</option>').join('');
}
function renderAttachments(){
  const box=$('#attachmentList');
  box.innerHTML=pendingAttachments.length?pendingAttachments.map((a,i)=>'<div class="asset-row"><div><div class="name">'+esc(a.name||a.url||'附件')+'</div><div class="meta">'+esc(a.type||'')+(a.size?' · '+formatBytes(a.size):'')+(a.url?' · '+esc(a.url):'')+'</div></div><button class="btn danger remove-att" data-i="'+i+'" type="button">删除</button></div>').join(''):'<div class="empty-mini">暂无附件</div>';
  box.querySelectorAll('.remove-att').forEach(b=>b.onclick=()=>{pendingAttachments.splice(Number(b.dataset.i),1);renderAttachments()});
}
function liveToolRef(t){
  const catalog={items:toolCatalog};
  return window.VIPToolCatalog?.find(catalog,t)||null;
}
function renderToolLinks(){
  const box=$('#shortcutList');
  box.innerHTML=pendingToolLinks.length?pendingToolLinks.map((t,i)=>{
    const live=liveToolRef(t);
    const title=live?.title||t.title||t.path||'快捷方式';
    const path=live?.path||t.path||'';
    const suffix=live?'':' · 工具中心中已不存在';
    return '<div class="asset-row"><div><div class="name">'+esc(title)+'</div><div class="meta">'+esc(path)+esc(suffix)+'</div></div><button class="btn danger remove-tool" data-i="'+i+'" type="button">删除</button></div>';
  }).join(''):'<div class="empty-mini">暂无快捷方式</div>';
  box.querySelectorAll('.remove-tool').forEach(b=>b.onclick=()=>{pendingToolLinks.splice(Number(b.dataset.i),1);renderToolLinks()});
}

async function load(){
  setStatus('正在同步…');
  try{
    const rows=unwrap(await base44.entities.VIPWorkflowDefinition.filter({key:'main'},'-updated_date',5,0));
    row=rows[0]||null;
    if(!row||!row.bundle||!Array.isArray(row.bundle.workflows))throw new Error('未找到话术数据');
    state=safeClone(row.bundle);
    ensureCategories();
    if(!activeFlowId||!state.workflows.some(f=>String(f.id)===String(activeFlowId)))activeFlowId=state.activeWorkflowId||state.workflows[0]?.id||'';
    render();
    setStatus('已同步','ok');
  }catch(e){
    $('#flowTitle').textContent='读取失败';
    $('#flowMeta').textContent=e?.message||String(e);
    $('#stepList').innerHTML='<div class="empty">无法读取话术数据，请刷新后重试。</div>';
    setStatus('读取失败','err');
  }
}

async function persist(message='已保存'){
  if(busy)return;
  busy=true;setStatus('保存中…');
  try{
    state.activeWorkflowId=activeFlowId;
    const payload={bundle:safeClone(state),version:Number(row?.version||0)+1,updated_by:'admin',updated_at:new Date().toISOString()};
    if(row){
      await base44.entities.VIPWorkflowDefinition.update(row.id,payload);
      row={...row,...payload};
    }else{
      row=await base44.entities.VIPWorkflowDefinition.create({key:'main',...payload});
    }
    setStatus(message,'ok');
    return true;
  }catch(e){
    setStatus('保存失败','err');
    vipAlert('保存失败：'+(e?.message||String(e)),{title:'保存失败'});
    return false;
  }finally{busy=false}
}

function hideStepContextMenu(){
  const menu=$('#stepContextMenu');
  if(menu)menu.hidden=true;
  contextStepId='';
}
function showStepContextMenu(e,id){
  e.preventDefault();
  e.stopPropagation();
  contextStepId=String(id||'');
  const flow=activeFlow();
  const step=(flow?.steps||[]).find(x=>String(x.id)===contextStepId);
  $('#stepContextTitle').textContent=step?.title||'话术操作';
  const menu=$('#stepContextMenu');
  menu.hidden=false;
  const pad=10,w=190,h=92;
  const x=Math.min(e.clientX,window.innerWidth-w-pad);
  const y=Math.min(e.clientY,window.innerHeight-h-pad);
  menu.style.left=Math.max(pad,x)+'px';
  menu.style.top=Math.max(pad,y)+'px';
}

function render(){
  ensureCategories();
  const flows=state.workflows||[];
  let sideHtml='';
  (state.categories||[]).forEach(cat=>{
    const items=flows.filter(f=>String(f.category)===String(cat.id));
    const collapsed=collapsedCategories.has(String(cat.id));
    sideHtml+='<section class="flow-group-card '+(collapsed?'collapsed':'')+'" data-category-card="'+esc(cat.id)+'">'+
      '<div class="flow-group-head" data-category-toggle="'+esc(cat.id)+'">'+
        '<b>'+esc(cat.name)+'</b>'+
        '<span class="flow-group-count">'+items.length+' 个流程</span>'+
        '<span class="flow-group-chevron">⌄</span>'+
      '</div>'+
      '<div class="flow-group-body">'+
        (items.length
          ?items.map(f=>'<button class="flow-item '+(String(f.id)===String(activeFlowId)?'active':'')+'" data-flow="'+esc(f.id)+'"><b>'+esc(f.name||'未命名流程')+'</b><span>'+(f.steps?.length||0)+' 条话术</span></button>').join('')
          :'<div class="empty-mini" style="padding:8px 10px">暂无流程</div>')+
      '</div>'+
    '</section>';
  });
  $('#flowList').innerHTML=sideHtml||'<div class="empty">暂无分类</div>';
  $('#flowList').querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{activeFlowId=b.dataset.flow;render()});
  $('#flowList').querySelectorAll('[data-category-toggle]').forEach(head=>head.onclick=()=>{
    const id=String(head.dataset.categoryToggle||'');
    if(collapsedCategories.has(id))collapsedCategories.delete(id);else collapsedCategories.add(id);
    render();
  });
  const flow=activeFlow();
  const categorySelect=$('#flowCategorySelect');
  if(categorySelect){
    categorySelect.innerHTML=(state.categories||[]).map(cat=>'<option value="'+esc(cat.id)+'">'+esc(cat.name)+'</option>').join('');
    categorySelect.disabled=!flow;
    if(flow)categorySelect.value=String(flow.category||'');
  }
  const currentCat=flow?categoryById(flow.category):null;
  const manageSelect=$('#categoryManageSelect');
  if(manageSelect){
    const oldValue=manageSelect.value;
    manageSelect.innerHTML=(state.categories||[]).map(cat=>'<option value="'+esc(cat.id)+'">'+esc(cat.name)+'</option>').join('');
    if(oldValue&&state.categories.some(x=>String(x.id)===String(oldValue)))manageSelect.value=oldValue;
    else if(currentCat)manageSelect.value=currentCat.id;
  }
  const managedCat=manageSelect?categoryById(manageSelect.value):currentCat;
  $('#renameCategory').disabled=!managedCat;
  $('#deleteCategory').disabled=!managedCat;
  const categoryLabel=currentCat?currentCat.name:'';

  $('#flowTitle').textContent=flow?.name||'暂无流程';
  $('#flowMeta').textContent=flow?(categoryLabel+' · 共 '+(flow.steps?.length||0)+' 条话术 · 修改后自动同步给业务员'):'请先新增一个流程';
  $('#addStep').disabled=!flow;
  $('#renameFlow').disabled=!flow;
  $('#deleteFlow').disabled=!flow;
  if(!flow){$('#stepList').innerHTML='<div class="empty">暂无流程，点击左侧“新增流程”开始。</div>';return}
  const steps=Array.isArray(flow.steps)?flow.steps:[];
  $('#stepList').innerHTML=steps.map((s,i)=>'<article class="step" data-step="'+esc(s.id)+'"><div class="step-head"><div class="num">'+(i+1)+'</div><div class="step-title"><b>'+esc(s.title||'未命名话术')+'</b><span>'+esc(s.type||'话术')+' · 附件 '+((s.attachments||[]).length)+' · 快捷方式 '+((s.toolLinks||[]).length)+'</span></div><div class="step-actions"><button class="btn move-up" '+(i===0?'disabled':'')+'>↑</button><button class="btn move-down" '+(i===steps.length-1?'disabled':'')+'>↓</button><button class="btn edit-step">编辑</button><button class="btn danger delete-step">删除</button></div></div><div class="preview"><div class="box"><div class="label">中文参考</div><div class="clip zh">'+esc(s.contentZh||'—')+'</div></div><div class="box"><div class="label">实际发送内容</div><div class="clip">'+esc(s.contentForeign||'—')+'</div></div></div></article>').join('')||'<div class="empty">这个流程还没有话术，点击“新增话术”。</div>';
  $('#stepList').querySelectorAll('.step').forEach(card=>{
    const id=card.dataset.step;
    card.querySelector('.edit-step').onclick=()=>openStep(id);
    card.querySelector('.delete-step').onclick=()=>deleteStep(id);
    card.querySelector('.move-up').onclick=()=>moveStep(id,-1);
    card.querySelector('.move-down').onclick=()=>moveStep(id,1);
    card.addEventListener('contextmenu',e=>showStepContextMenu(e,id));
  });
}

async function openStep(id='',insertIndex=null,insertLabel=''){
  const flow=activeFlow(); if(!flow)return;
  await loadToolCatalog();
  hideStepContextMenu();
  editingStepId=id;
  pendingInsertIndex=id?null:(Number.isInteger(insertIndex)?insertIndex:null);
  const s=(flow.steps||[]).find(x=>String(x.id)===String(id))||{title:'',type:'话术',contentZh:'',contentForeign:'',note:''};
  $('#stepModalTitle').textContent=id?'编辑话术':(insertLabel||'新增话术');
  $('#stepTitle').value=s.title||'';
  $('#stepType').value=s.type||'话术';
  $('#stepZh').value=s.contentZh||'';
  $('#stepForeign').value=s.contentForeign||'';
  $('#stepNote').value=s.note||'';
  pendingAttachments=safeClone(Array.isArray(s.attachments)?s.attachments:[]);
  pendingToolLinks=safeClone(Array.isArray(s.toolLinks)?s.toolLinks:[]);
  renderAttachments();renderToolLinks();
  $('#shortcutSelectDe').value='';$('#shortcutSelectUs').value='';
  $('#stepNoteMsg').hidden=true;
  $('#stepModal').hidden=false;
  setTimeout(()=>$('#stepTitle').focus(),30);
}
function closeStep(){editingStepId='';pendingInsertIndex=null;$('#stepModal').hidden=true}
async function saveStep(){
  const flow=activeFlow();if(!flow)return;
  const title=$('#stepTitle').value.trim(),type=$('#stepType').value||'话术',contentZh=$('#stepZh').value.trim(),contentForeign=$('#stepForeign').value.trim(),note=$('#stepNote').value.trim();
  if(!title){$('#stepNoteMsg').hidden=false;$('#stepNoteMsg').className='notice err';$('#stepNoteMsg').textContent='请输入话术标题。';return}
  flow.steps=Array.isArray(flow.steps)?flow.steps:[];
  if(editingStepId){
    const idx=flow.steps.findIndex(x=>String(x.id)===String(editingStepId));
    if(idx>=0)flow.steps[idx]={...flow.steps[idx],title,type,contentZh,contentForeign,note,attachments:safeClone(pendingAttachments),toolLinks:safeClone(pendingToolLinks)};
  }else{
    const newStep={id:uid(),title,type,contentZh,contentForeign,note,attachments:safeClone(pendingAttachments),toolLinks:safeClone(pendingToolLinks)};
    if(Number.isInteger(pendingInsertIndex)){
      const at=Math.max(0,Math.min(pendingInsertIndex,flow.steps.length));
      flow.steps.splice(at,0,newStep);
    }else{
      flow.steps.push(newStep);
    }
  }
  const ok=await persist('话术已保存');
  if(ok){closeStep();render()}
}
async function deleteStep(id){
  const flow=activeFlow();if(!flow)return;
  const s=(flow.steps||[]).find(x=>String(x.id)===String(id));
  if(!await vipConfirm('确定删除「'+(s?.title||'这条话术')+'」吗？',{title:'删除话术',confirmText:'删除',danger:true}))return;
  flow.steps=(flow.steps||[]).filter(x=>String(x.id)!==String(id));
  if(await persist('话术已删除'))render();
}
async function moveStep(id,delta){
  const flow=activeFlow();if(!flow)return;
  const a=flow.steps||[],i=a.findIndex(x=>String(x.id)===String(id)),j=i+delta;
  if(i<0||j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  if(await persist('顺序已保存'))render();
}

$('#addStep').onclick=()=>openStep('');
$('#stepContextMenu').querySelectorAll('[data-insert]').forEach(btn=>btn.onclick=()=>{
  const flow=activeFlow();
  if(!flow||!contextStepId)return hideStepContextMenu();
  const idx=(flow.steps||[]).findIndex(x=>String(x.id)===String(contextStepId));
  if(idx<0)return hideStepContextMenu();
  const below=btn.dataset.insert==='below';
  openStep('',idx+(below?1:0),below?'在下方添加新话术':'在上方添加新话术');
});
$('#closeStepModal').onclick=closeStep;$('#cancelStep').onclick=closeStep;$('#saveStep').onclick=saveStep;

$('#attachmentFile').addEventListener('change',async e=>{
  const files=[...(e.target.files||[])]; if(!files.length)return;
  for(const file of files){
    if(!String(file.type||'').startsWith('image/')){vipAlert(file.name+' 不是图片文件。',{title:'无法添加图片'});continue}
    if(file.size>8*1024*1024){vipAlert(file.name+' 超过 8MB，请压缩图片后再上传。',{title:'图片过大'});continue}
    try{
      pendingAttachments.push({id:attachmentId(),name:file.name,type:file.type||'',size:file.size,data:await fileToData(file)});
    }catch(err){vipAlert('读取图片失败：'+file.name,{title:'读取失败'})}
  }
  e.target.value='';renderAttachments();
});
function addShortcutFrom(selectId){
  const sel=$(selectId),i=Number(sel.value);
  if(!Number.isInteger(i)||!toolCatalog[i])return;
  const t=toolCatalog[i];
  if(!['de','us'].includes(String(t.category||'').toLowerCase()))return;
  if(pendingToolLinks.some(x=>String(x.path||'')===String(normalizeToolPath(t.path)))){vipAlert('这个快捷方式已经添加过了。',{title:'重复快捷方式'});return}
  pendingToolLinks.push({id:toolId(),toolId:t.id,title:t.title,path:normalizeToolPath(t.path),category:t.category});
  sel.value='';renderToolLinks();
}
$('#addShortcutDe').onclick=()=>addShortcutFrom('#shortcutSelectDe');
$('#addShortcutUs').onclick=()=>addShortcutFrom('#shortcutSelectUs');
$('#stepModal').onclick=e=>{if(e.target===$('#stepModal'))closeStep()};
$('#reloadBtn').onclick=load;

$('#addFlow').onclick=async()=>{
  ensureCategories();
  const name=await vipPrompt('请输入新流程名称：',{title:'新增流程',placeholder:'例如 德国客服跟进流程',confirmText:'下一步'});
  if(!name||!name.trim())return;
  const category=await vipSelect('请选择新流程所属分类：',{
    title:'选择流程分类',
    value:activeFlow()?.category||state.categories?.[0]?.id||'',
    options:(state.categories||[]).map(x=>({value:x.id,label:x.name})),
    confirmText:'创建'
  });
  if(!category)return;
  const id=uid('flow');state.workflows=Array.isArray(state.workflows)?state.workflows:[];
  state.workflows.push({id,name:name.trim(),category,description:'',color:'#6d4aff',steps:[]});activeFlowId=id;
  if(await persist('流程已新增'))render();
};

$('#addCategory').onclick=async()=>{
  const name=await vipPrompt('请输入新分类名称：',{title:'新建分类',placeholder:'例如 加拿大流程',confirmText:'创建'});
  if(!name||!name.trim())return;
  ensureCategories();
  if(state.categories.some(x=>x.name.trim()===name.trim())){vipAlert('已经存在同名分类。',{title:'无法创建'});return}
  const id=uid('cat');
  state.categories.push({id,name:name.trim(),order:state.categories.length+1});
  if(await persist('分类已新增')){render();setTimeout(()=>{$('#categoryManageSelect').value=id},0)}
};

$('#renameCategory').onclick=async()=>{
  const cat=categoryById($('#categoryManageSelect').value);if(!cat)return;
  const name=await vipPrompt('修改分类名称：',{title:'修改分类',value:cat.name,confirmText:'保存'});
  if(!name||!name.trim())return;
  cat.name=name.trim();
  if(await persist('分类名称已修改'))render();
};

$('#deleteCategory').onclick=async()=>{
  const cat=categoryById($('#categoryManageSelect').value);if(!cat)return;
  const used=(state.workflows||[]).filter(x=>String(x.category)===String(cat.id));
  if(used.length){
    vipAlert('这个分类下面还有 '+used.length+' 个流程。请先把这些流程移动到其他分类，再删除该分类。',{title:'暂时不能删除'});
    return;
  }
  if(!await vipConfirm('确定删除分类「'+cat.name+'」吗？',{title:'删除分类',confirmText:'删除',danger:true}))return;
  state.categories=state.categories.filter(x=>String(x.id)!==String(cat.id));
  if(await persist('分类已删除'))render();
};

$('#flowCategorySelect').onchange=async()=>{
  const f=activeFlow();if(!f)return;
  f.category=$('#flowCategorySelect').value;
  if(await persist('流程分类已修改'))render();
};

$('#renameFlow').onclick=async()=>{
  const f=activeFlow();if(!f)return;
  const name=await vipPrompt('修改流程名称：',{title:'修改流程名称',value:f.name||'',confirmText:'保存'});
  if(!name||!name.trim())return;
  f.name=name.trim();if(await persist('流程名称已修改'))render();
};

$('#deleteFlow').onclick=async()=>{
  const f=activeFlow();if(!f)return;
  if(!await vipConfirm('确定删除整个流程「'+(f.name||'未命名流程')+'」吗？其中所有话术都会一起删除。',{title:'删除流程',confirmText:'删除',danger:true}))return;
  state.workflows=(state.workflows||[]).filter(x=>String(x.id)!==String(f.id));
  activeFlowId=state.workflows[0]?.id||'';
  if(await persist('流程已删除'))render();
};
document.addEventListener('click',e=>{if(!e.target.closest('#stepContextMenu'))hideStepContextMenu()});
window.addEventListener('scroll',hideStepContextMenu,true);
window.addEventListener('resize',hideStepContextMenu);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#stepContextMenu').hidden){hideStepContextMenu();return}
    if(!$('#stepModal').hidden)closeStep();
  }
});
loadToolCatalog();load();
</script>
