<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>MOSEN VIP · 话术管理</title>
<link rel="icon" type="image/svg+xml" href="./mosen-logo.svg">
<style>
:root{--line:#e6e9ef;--text:#172033;--muted:#758095;--bg:#f7f8fb;--purple:#6d4aff;--danger:#c9362b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:12px;font-weight:900;color:var(--purple);letter-spacing:.05em}.side h1{font-size:19px;margin:5px 0 4px}.sub{font-size:11px;color:var(--muted);line-height:1.5}
.flow-actions{display:flex;gap:7px;margin:14px 0}.btn{border:0;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer;background:#eef1f5;color:#344054}.btn.primary{background:var(--purple);color:#fff}.btn.danger{background:#fff0ef;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}
.flow-list{display:grid;gap:6px}.flow-item{width:100%;border:0;background:transparent;border-radius:11px;padding:10px;text-align:left;cursor:pointer}.flow-item:hover{background:#f6f4ff}.flow-item.active{background:#eeeaff;color:#5c38d0}.flow-item b{display:block;font-size:13px}.flow-item span{display:block;font-size:10px;color:#8a93a4;margin-top:3px}
.main{min-width:0;padding:18px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:12px;z-index:5;box-shadow:0 8px 28px rgba(20,29,48,.05)}
.toolbar h2{font-size:18px;margin:0}.toolbar .meta{font-size:11px;color:var(--muted);margin-top:3px}.spacer{flex:1}.save-status{font-size:11px;color:#677287}
.steps{display:grid;gap:8px;margin-top:12px}.step{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.step-head{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid #eef1f5}.num{width:27px;height:27px;border-radius:8px;background:#f1edff;color:#633fd7;display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto}.step-title{min-width:0;flex:1}.step-title b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step-title span{font-size:10px;color:#8a93a4}.step-actions{display:flex;gap:5px}
.preview{padding:9px 11px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{min-width:0}.label{font-size:9px;font-weight:900;color:#8a93a4;margin-bottom:3px}.clip{font-size:12px;line-height:1.45;color:#344054;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.clip.zh{background:#f7f8fa;border-radius:8px;padding:7px 8px;color:#5e697b}
.empty{background:#fff;border:1px dashed #cfd5df;border-radius:14px;padding:36px;text-align:center;color:#7b8495;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:50;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 30px 90px rgba(15,23,42,.25)}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.modal-head h3{margin:0;font-size:18px}.grid{display:grid;grid-template-columns:1fr 180px;gap:10px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;color:#667085;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #d9dee7;border-radius:10px;padding:9px 10px;outline:none;background:#fff}.field textarea{min-height:115px;resize:vertical}.field textarea.large{min-height:150px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9b87ee;box-shadow:0 0 0 3px rgba(109,74,255,.08)}
.notice{margin-top:10px;padding:9px 11px;border-radius:9px;background:#f6f8fa;font-size:11px;color:#667085}.notice.ok{background:#effaf5;color:#087443}.notice.err{background:#fff1f0;color:#b42318}
.asset-section{margin-top:14px;padding-top:14px;border-top:1px solid #eef1f5}.asset-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.asset-head b{font-size:12px}.asset-head span{font-size:10px;color:#8a93a4}.asset-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 9px;border:1px solid #e3e7ee;border-radius:9px;background:#fafbfc;margin-top:6px}.asset-row .name{min-width:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-row .meta{font-size:9px;color:#98a2b3;margin-top:2px}.asset-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:7px}.asset-add.three{grid-template-columns:140px minmax(0,1fr) auto}.file-label{position:relative;overflow:hidden}.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}.empty-mini{font-size:10px;color:#98a2b3;padding:7px 0}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.flow-list{display:flex;overflow:auto}.flow-item{min-width:190px}.main{padding:12px}.preview{grid-template-columns:1fr}.toolbar{top:5px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">MOSEN VIP · 管理员</div>
    <h1>话术管理</h1>
    <div class="sub">在这里修改、添加、删除维权流程话术。保存后，业务员下一次打开维权流程会自动读取最新内容。</div>
    <div class="flow-actions">
      <button class="btn primary" id="addFlow">新增流程</button>
      <button class="btn" id="renameFlow">改流程名</button>
      <button class="btn danger" id="deleteFlow">删除流程</button>
    </div>
    <div class="flow-list" id="flowList"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <div><h2 id="flowTitle">正在读取…</h2><div class="meta" id="flowMeta">请稍候</div></div>
      <div class="spacer"></div>
      <span class="save-status" id="saveStatus"></span>
      <button class="btn primary" id="addStep">新增话术</button>
      <button class="btn" id="reloadBtn">刷新</button>
    </div>
    <div class="steps" id="stepList"></div>
  </main>
</div>

<div class="modal" id="stepModal" hidden>
  <div class="modal-card">
    <div class="modal-head"><h3 id="stepModalTitle">编辑话术</h3><div class="spacer"></div><button class="btn" id="closeStepModal">关闭</button></div>
    <div class="grid">
      <div class="field"><label>标题</label><input id="stepTitle" placeholder="例如 自我介绍"></div>
      <div class="field"><label>类型</label><select id="stepType"><option>话术</option><option>提问</option><option>客户回复</option><option>操作提示</option><option>说明</option><option>结束语</option></select></div>
    </div>
    <div class="field"><label>中文参考</label><textarea class="large" id="stepZh"></textarea></div>
    <div class="field"><label>实际发送内容（德语 / 英语）</label><textarea class="large" id="stepForeign"></textarea></div>
    <div class="field"><label>备注（可选）</label><textarea id="stepNote"></textarea></div>

    <div class="asset-section">
      <div class="asset-head"><b>附件管理</b><span>上传图片 / PDF / 文档，或填写 VIP 内部路径、网址</span></div>
      <div class="asset-add">
        <label class="btn file-label">选择附件<input id="attachmentFile" type="file" multiple></label>
        <div></div>
      </div>
      <div class="asset-add">
        <input id="attachmentPath" placeholder="例如 data/chat-flow-assets/文件.png 或 https://...">
        <button class="btn" id="addAttachmentPath" type="button">添加路径</button>
      </div>
      <div id="attachmentList"></div>
    </div>

    <div class="asset-section">
      <div class="asset-head"><b>快捷方式管理</b><span>选择 VIP 工具，或者手动填写标题和路径</span></div>
      <div class="asset-add">
        <select id="shortcutSelect"><option value="">选择 VIP 工具…</option></select>
        <button class="btn" id="addShortcut" type="button">添加工具</button>
      </div>
      <div class="asset-add three">
        <input id="shortcutTitle" placeholder="快捷方式标题">
        <input id="shortcutPath" placeholder="例如 网站风险查询.html">
        <button class="btn" id="addCustomShortcut" type="button">自定义添加</button>
      </div>
      <div id="shortcutList"></div>
    </div>

    <div class="row" style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn" id="cancelStep">取消</button>
      <button class="btn primary" id="saveStep">保存话术</button>
    </div>
    <div id="stepNoteMsg" class="notice" hidden></div>
  </div>
</div>

<script type="module">
import { base44, esc } from './base44.js';

if(localStorage.getItem('mVIP_admin')!=='1'){
  location.href='./admin.html';
}

const $=s=>document.querySelector(s);
let row=null,state={workflows:[]},activeFlowId='',editingStepId='',busy=false;
let pendingAttachments=[],pendingToolLinks=[],toolCatalog=[];

function uid(prefix='step'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function unwrap(v){return Array.isArray(v)?v:(v?.items||[])}
function activeFlow(){return (state.workflows||[]).find(f=>String(f.id)===String(activeFlowId))||state.workflows?.[0]||null}
function setStatus(text,type=''){const el=$('#saveStatus');el.textContent=text;el.style.color=type==='err'?'#b42318':type==='ok'?'#087443':'#677287'}
function safeClone(v){return JSON.parse(JSON.stringify(v))}
function formatBytes(n){n=Number(n||0);if(!n)return'';const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i?n.toFixed(1):Math.round(n))+' '+u[i]}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=reject;r.readAsDataURL(file)})}
function attachmentId(){return uid('att')}
function toolId(){return uid('tool')}
function normalizeToolPath(p){return String(p||'').trim().replace(/^\.\/toolbox\//,'').replace(/^toolbox\//,'').replace(/^\.\//,'')}

const FALLBACK_TOOLS=[
  {id:'tether-freeze-us',title:'Tether 冻结报告',path:'Tether冻结报告.html',category:'us'},
  {id:'tether-freeze-de',title:'Tether 冻结报告 · 德国',path:'Tether冻结报告-德国.html',category:'de'},
  {id:'tether-custody-us',title:'Tether 冻结资金保留',path:'Tether冻结资金保留.html',category:'us'},
  {id:'tether-custody-de',title:'Tether 冻结资金保留 · 德国',path:'Tether冻结资金保留-德国.html',category:'de'},
  {id:'risk-us',title:'网站风险查询',path:'网站风险查询.html',category:'us'},
  {id:'risk-de',title:'网站风险查询 · 德国',path:'网站风险查询-德国.html',category:'de'},
  {id:'investigation-us',title:'资金路径调查',path:'资金路径调查.html',category:'us'},
  {id:'investigation-de',title:'资金路径调查 · 德国',path:'资金路径调查-德国.html',category:'de'},
  {id:'lawyer-report-us',title:'资金路径调查律师报告',path:'资金路径调查律师报告.html',category:'us'},
  {id:'lawyer-report-de',title:'资金路径调查律师报告 · 德国',path:'资金路径调查律师报告-德国.html',category:'de'},
  {id:'assistant-report-us',title:'资金路径调查助理报告',path:'资金路径调查助理报告.html',category:'us'},
  {id:'assistant-report-de',title:'资金路径调查助理报告 · 德国',path:'资金路径调查助理报告-德国.html',category:'de'},
  {id:'docx-editor',title:'DOCX 文件编辑器',path:'DOCX文件编辑器.html',category:'other'},
  {id:'email-editor',title:'邮件编辑器',path:'邮件编辑器.html',category:'other'},
  {id:'onchain-us',title:'Onchain Wallet · Address Intelligence',path:'tools/Onchain钱包地址查询.html',category:'us'},
  {id:'onchain-de',title:'Onchain Wallet · Adressanalyse',path:'tools/Onchain钱包地址查询-德国.html',category:'de'}
];

async function loadToolCatalog(){
  let list=[...FALLBACK_TOOLS];
  try{
    const res=await fetch('./toolbox/tools/index.json',{cache:'no-store'});
    if(res.ok){
      const data=await res.json();
      (data.tools||[]).forEach(t=>list.push({id:t.id||toolId(),title:t.title||t.name,path:t.path,category:t.category||'other'}));
    }
  }catch(_){}
  const seen=new Set();
  toolCatalog=list.filter(t=>{const k=String(t.path||'');if(!k||seen.has(k))return false;seen.add(k);return true});
  $('#shortcutSelect').innerHTML='<option value="">选择 VIP 工具…</option>'+toolCatalog.map((t,i)=>'<option value="'+i+'">'+esc(t.title)+' · '+esc(t.path)+'</option>').join('');
}
function renderAttachments(){
  const box=$('#attachmentList');
  box.innerHTML=pendingAttachments.length?pendingAttachments.map((a,i)=>'<div class="asset-row"><div><div class="name">'+esc(a.name||a.url||'附件')+'</div><div class="meta">'+esc(a.type||'')+(a.size?' · '+formatBytes(a.size):'')+(a.url?' · '+esc(a.url):'')+'</div></div><button class="btn danger remove-att" data-i="'+i+'" type="button">删除</button></div>').join(''):'<div class="empty-mini">暂无附件</div>';
  box.querySelectorAll('.remove-att').forEach(b=>b.onclick=()=>{pendingAttachments.splice(Number(b.dataset.i),1);renderAttachments()});
}
function renderToolLinks(){
  const box=$('#shortcutList');
  box.innerHTML=pendingToolLinks.length?pendingToolLinks.map((t,i)=>'<div class="asset-row"><div><div class="name">'+esc(t.title||t.path||'快捷方式')+'</div><div class="meta">'+esc(t.path||'')+'</div></div><button class="btn danger remove-tool" data-i="'+i+'" type="button">删除</button></div>').join(''):'<div class="empty-mini">暂无快捷方式</div>';
  box.querySelectorAll('.remove-tool').forEach(b=>b.onclick=()=>{pendingToolLinks.splice(Number(b.dataset.i),1);renderToolLinks()});
}

async function load(){
  setStatus('正在同步…');
  try{
    const rows=unwrap(await base44.entities.VIPWorkflowDefinition.filter({key:'main'},'-updated_date',5,0));
    row=rows[0]||null;
    if(!row||!row.bundle||!Array.isArray(row.bundle.workflows))throw new Error('未找到话术数据');
    state=safeClone(row.bundle);
    if(!activeFlowId||!state.workflows.some(f=>String(f.id)===String(activeFlowId)))activeFlowId=state.activeWorkflowId||state.workflows[0]?.id||'';
    render();
    setStatus('已同步','ok');
  }catch(e){
    $('#flowTitle').textContent='读取失败';
    $('#flowMeta').textContent=e?.message||String(e);
    $('#stepList').innerHTML='<div class="empty">无法读取话术数据，请刷新后重试。</div>';
    setStatus('读取失败','err');
  }
}

async function persist(message='已保存'){
  if(busy)return;
  busy=true;setStatus('保存中…');
  try{
    state.activeWorkflowId=activeFlowId;
    const payload={bundle:safeClone(state),version:Number(row?.version||0)+1,updated_by:'admin',updated_at:new Date().toISOString()};
    if(row){
      await base44.entities.VIPWorkflowDefinition.update(row.id,payload);
      row={...row,...payload};
    }else{
      row=await base44.entities.VIPWorkflowDefinition.create({key:'main',...payload});
    }
    setStatus(message,'ok');
    return true;
  }catch(e){
    setStatus('保存失败','err');
    alert('保存失败：'+(e?.message||String(e)));
    return false;
  }finally{busy=false}
}

function render(){
  const flows=state.workflows||[];
  $('#flowList').innerHTML=flows.map(f=>'<button class="flow-item '+(String(f.id)===String(activeFlowId)?'active':'')+'" data-flow="'+esc(f.id)+'"><b>'+esc(f.name||'未命名流程')+'</b><span>'+(f.steps?.length||0)+' 条话术</span></button>').join('')||'<div class="empty">暂无流程</div>';
  $('#flowList').querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{activeFlowId=b.dataset.flow;render()});
  const flow=activeFlow();
  $('#flowTitle').textContent=flow?.name||'暂无流程';
  $('#flowMeta').textContent=flow?'共 '+(flow.steps?.length||0)+' 条话术 · 修改后自动同步给业务员':'请先新增一个流程';
  $('#addStep').disabled=!flow;
  $('#renameFlow').disabled=!flow;
  $('#deleteFlow').disabled=!flow;
  if(!flow){$('#stepList').innerHTML='<div class="empty">暂无流程，点击左侧“新增流程”开始。</div>';return}
  const steps=Array.isArray(flow.steps)?flow.steps:[];
  $('#stepList').innerHTML=steps.map((s,i)=>'<article class="step" data-step="'+esc(s.id)+'"><div class="step-head"><div class="num">'+(i+1)+'</div><div class="step-title"><b>'+esc(s.title||'未命名话术')+'</b><span>'+esc(s.type||'话术')+' · 附件 '+((s.attachments||[]).length)+' · 快捷方式 '+((s.toolLinks||[]).length)+'</span></div><div class="step-actions"><button class="btn move-up" '+(i===0?'disabled':'')+'>↑</button><button class="btn move-down" '+(i===steps.length-1?'disabled':'')+'>↓</button><button class="btn edit-step">编辑</button><button class="btn danger delete-step">删除</button></div></div><div class="preview"><div class="box"><div class="label">中文参考</div><div class="clip zh">'+esc(s.contentZh||'—')+'</div></div><div class="box"><div class="label">实际发送内容</div><div class="clip">'+esc(s.contentForeign||'—')+'</div></div></div></article>').join('')||'<div class="empty">这个流程还没有话术，点击“新增话术”。</div>';
  $('#stepList').querySelectorAll('.step').forEach(card=>{
    const id=card.dataset.step;
    card.querySelector('.edit-step').onclick=()=>openStep(id);
    card.querySelector('.delete-step').onclick=()=>deleteStep(id);
    card.querySelector('.move-up').onclick=()=>moveStep(id,-1);
    card.querySelector('.move-down').onclick=()=>moveStep(id,1);
  });
}

function openStep(id=''){
  const flow=activeFlow(); if(!flow)return;
  editingStepId=id;
  const s=(flow.steps||[]).find(x=>String(x.id)===String(id))||{title:'',type:'话术',contentZh:'',contentForeign:'',note:''};
  $('#stepModalTitle').textContent=id?'编辑话术':'新增话术';
  $('#stepTitle').value=s.title||'';
  $('#stepType').value=s.type||'话术';
  $('#stepZh').value=s.contentZh||'';
  $('#stepForeign').value=s.contentForeign||'';
  $('#stepNote').value=s.note||'';
  pendingAttachments=safeClone(Array.isArray(s.attachments)?s.attachments:[]);
  pendingToolLinks=safeClone(Array.isArray(s.toolLinks)?s.toolLinks:[]);
  renderAttachments();renderToolLinks();
  $('#attachmentPath').value='';$('#shortcutTitle').value='';$('#shortcutPath').value='';$('#shortcutSelect').value='';
  $('#stepNoteMsg').hidden=true;
  $('#stepModal').hidden=false;
  setTimeout(()=>$('#stepTitle').focus(),30);
}
function closeStep(){editingStepId='';$('#stepModal').hidden=true}
async function saveStep(){
  const flow=activeFlow();if(!flow)return;
  const title=$('#stepTitle').value.trim(),type=$('#stepType').value||'话术',contentZh=$('#stepZh').value.trim(),contentForeign=$('#stepForeign').value.trim(),note=$('#stepNote').value.trim();
  if(!title){$('#stepNoteMsg').hidden=false;$('#stepNoteMsg').className='notice err';$('#stepNoteMsg').textContent='请输入话术标题。';return}
  flow.steps=Array.isArray(flow.steps)?flow.steps:[];
  if(editingStepId){
    const idx=flow.steps.findIndex(x=>String(x.id)===String(editingStepId));
    if(idx>=0)flow.steps[idx]={...flow.steps[idx],title,type,contentZh,contentForeign,note,attachments:safeClone(pendingAttachments),toolLinks:safeClone(pendingToolLinks)};
  }else{
    flow.steps.push({id:uid(),title,type,contentZh,contentForeign,note,attachments:safeClone(pendingAttachments),toolLinks:safeClone(pendingToolLinks)});
  }
  const ok=await persist('话术已保存');
  if(ok){closeStep();render()}
}
async function deleteStep(id){
  const flow=activeFlow();if(!flow)return;
  const s=(flow.steps||[]).find(x=>String(x.id)===String(id));
  if(!confirm('确定删除「'+(s?.title||'这条话术')+'」吗？'))return;
  flow.steps=(flow.steps||[]).filter(x=>String(x.id)!==String(id));
  if(await persist('话术已删除'))render();
}
async function moveStep(id,delta){
  const flow=activeFlow();if(!flow)return;
  const a=flow.steps||[],i=a.findIndex(x=>String(x.id)===String(id)),j=i+delta;
  if(i<0||j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  if(await persist('顺序已保存'))render();
}

$('#addStep').onclick=()=>openStep('');
$('#closeStepModal').onclick=closeStep;$('#cancelStep').onclick=closeStep;$('#saveStep').onclick=saveStep;

$('#attachmentFile').addEventListener('change',async e=>{
  const files=[...(e.target.files||[])]; if(!files.length)return;
  for(const file of files){
    if(file.size>8*1024*1024){alert(file.name+' 超过 8MB。较大的附件请放入 VIP 工具箱后使用“添加路径”。');continue}
    try{
      pendingAttachments.push({id:attachmentId(),name:file.name,type:file.type||'',size:file.size,data:await fileToData(file)});
    }catch(err){alert('读取附件失败：'+file.name)}
  }
  e.target.value='';renderAttachments();
});
$('#addAttachmentPath').onclick=()=>{
  const p=$('#attachmentPath').value.trim();if(!p)return;
  const name=decodeURIComponent(p.split('/').pop().split('?')[0]||'附件');
  pendingAttachments.push({id:attachmentId(),name,url:p});$('#attachmentPath').value='';renderAttachments();
};
$('#addShortcut').onclick=()=>{
  const i=Number($('#shortcutSelect').value);if(!Number.isInteger(i)||!toolCatalog[i])return;
  const t=toolCatalog[i];pendingToolLinks.push({id:toolId(),title:t.title,path:normalizeToolPath(t.path),category:t.category||'other'});
  $('#shortcutSelect').value='';renderToolLinks();
};
$('#addCustomShortcut').onclick=()=>{
  const title=$('#shortcutTitle').value.trim(),path=normalizeToolPath($('#shortcutPath').value);
  if(!title||!path){alert('请填写快捷方式标题和路径。');return}
  pendingToolLinks.push({id:toolId(),title,path,category:'other'});
  $('#shortcutTitle').value='';$('#shortcutPath').value='';renderToolLinks();
};
$('#stepModal').onclick=e=>{if(e.target===$('#stepModal'))closeStep()};
$('#reloadBtn').onclick=load;

$('#addFlow').onclick=async()=>{
  const name=prompt('请输入新流程名称：');if(!name?.trim())return;
  const id=uid('flow');state.workflows=Array.isArray(state.workflows)?state.workflows:[];
  state.workflows.push({id,name:name.trim(),description:'',color:'#6d4aff',steps:[]});activeFlowId=id;
  if(await persist('流程已新增'))render();
};
$('#renameFlow').onclick=async()=>{
  const f=activeFlow();if(!f)return;
  const name=prompt('修改流程名称：',f.name||'');if(!name?.trim())return;
  f.name=name.trim();if(await persist('流程名称已修改'))render();
};
$('#deleteFlow').onclick=async()=>{
  const f=activeFlow();if(!f)return;
  if(!confirm('确定删除整个流程「'+(f.name||'未命名流程')+'」吗？其中所有话术都会一起删除。'))return;
  state.workflows=(state.workflows||[]).filter(x=>String(x.id)!==String(f.id));
  activeFlowId=state.workflows[0]?.id||'';
  if(await persist('流程已删除'))render();
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#stepModal').hidden)closeStep()});
loadToolCatalog();load();
</script>
</body>
</html>
